<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GTALHub | Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0a0a0f;--panel:#111118;--line:#1e1e2e;--text:#f5f5f5;--muted:#8888aa;
--green:#00ff88;--cyan:#00ccff;--yellow:#ffcc00;--red:#ff5c7a;
--display:"Bebas Neue",-apple-system,BlinkMacSystemFont,sans-serif;
--mono:"Roboto Mono",ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 var(--mono);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
[hidden]{display:none!important}

nav{position:sticky;top:0;z-index:5;background:rgba(10,10,15,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-family:var(--display);font-size:30px;letter-spacing:.04em;color:var(--text);text-decoration:none}
.logo span{color:var(--green)}
.logo:hover{color:var(--green)}
.who{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:13px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:13px;cursor:pointer}
.link:hover{color:var(--green)}

h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1}
h2{font-size:48px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 36px}
section{padding:72px 0}

/* sign in */
.gate{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:40px 24px;position:relative}
.gate::before{content:"";position:absolute;inset:0;pointer-events:none;
background:radial-gradient(70% 60% at 50% 50%,rgba(0,255,136,.07) 0%,transparent 70%),
linear-gradient(rgba(0,255,136,.035) 1px,transparent 1px) 0 0/48px 48px,
linear-gradient(90deg,rgba(0,255,136,.035) 1px,transparent 1px) 0 0/48px 48px}
.box{position:relative;width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:30px}
.box::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--green),transparent)}
.box h2{font-size:40px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:11px 12px;color:var(--text);font:14px var(--mono)}
input:focus{outline:none;border-color:rgba(0,255,136,.5)}
.btn{display:inline-block;width:100%;margin-top:22px;padding:13px 22px;border:0;border-radius:4px;font:700 14px var(--mono);text-transform:uppercase;letter-spacing:.08em;
background:var(--green);color:#000;cursor:pointer;transition:box-shadow .15s}
.btn:hover{box-shadow:0 0 24px rgba(0,255,136,.4)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.msg{margin:14px 0 0;font-size:13px;color:var(--muted);min-height:1em}
.msg.err{color:var(--red)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px;
display:flex;flex-direction:column;position:relative;overflow:hidden;transition:border-color .15s,transform .15s;text-decoration:none}
.card::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--green),transparent)}
a.card:hover{border-color:rgba(0,255,136,.4);transform:translateY(-2px)}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:3px;
color:var(--cyan);background:rgba(0,204,255,.067);border:1px solid rgba(0,204,255,.333)}
.status{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.status::before{content:"●"}
.status.live{color:var(--green)}
.status.soon{color:var(--yellow)}
.card h3{font-size:32px;margin:0 0 10px}
.card p{color:var(--muted);margin:0 0 22px;flex:1;font-size:14px}
.go{font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.url{display:block;margin-top:8px;font-size:12px;color:var(--muted);word-break:break-all}
.empty{color:var(--muted)}
</style>
</head>
<body>

<nav>
<div class="wrap">
<a class="logo" href="/">GTAL<span>Hub</span></a>
<div class="who" id="who" hidden><span id="whoEmail"></span><button class="link" id="out" type="button">Sign out</button></div>
</div>
</nav>

<div class="gate" id="gate" hidden>
<form class="box" id="signin">
<h2>Sign in</h2>
<p class="sub" style="margin:0">The app list is for GTALHub members only.</p>
<label for="em">Email</label>
<input id="em" type="email" autocomplete="username" required>
<label for="pw">Password</label>
<input id="pw" type="password" autocomplete="current-password" required>
<button class="btn" id="go" type="submit">Sign in</button>
<p class="msg" id="msg"></p>
</form>
</div>

<main id="list" hidden>
<section>
<div class="wrap">
<h2>The Lineup</h2>
<p class="sub">Every app on GTALHub. Each one works on its own link, so you can send someone just the one they need.</p>
<div class="grid" id="grid"></div>
</div>
</section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
// Same Supabase project and sign-in as the Weigh-Off. This key is the public one, safe in a web page.
// The list itself is only handed out by Supabase to signed-in accounts on the members list (see the hub_apps rules).
const sb = createClient("https://hjwuluhdiczmssldyeus.supabase.co", "sb_publishable_zAZpo7UDyx1eHD_HpayR-g_RRjdgtO9");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^(https:\/\/|\/)/.test(u || "") ? u : "#";

function show(which){ $("gate").hidden = which !== "gate"; $("list").hidden = which !== "list"; }

async function load(session){
  if(!session){ $("who").hidden = true; show("gate"); return; }
  $("whoEmail").textContent = session.user.email; $("who").hidden = false;
  const { data, error } = await sb.from("hub_apps").select("name,tag,status,url,blurb").order("sort");
  if(error){ show("gate"); msg("Couldn't load the list: " + error.message, true); return; }
  if(!data.length){ show("gate"); msg("This account isn't on the GTALHub members list.", true); return; }
  const live = s => /live/i.test(s) ? "live" : "soon";
  $("grid").innerHTML = data.map(a => {
    const u = safeUrl(a.url), full = u.startsWith("/") ? location.origin + u : u;
    return `<a class="card" href="${esc(u)}">
      <div class="meta"><span class="tag">${esc(a.tag)}</span><span class="status ${live(a.status)}">${esc(a.status)}</span></div>
      <h3>${esc(a.name)}</h3><p>${esc(a.blurb)}</p>
      <span class="go">Launch →</span><span class="url">${esc(full)}</span></a>`;
  }).join("");
  show("list");
}
function msg(t, err){ $("msg").textContent = t; $("msg").classList.toggle("err", !!err); }

$("signin").addEventListener("submit", async e => {
  e.preventDefault(); $("go").disabled = true; msg("Signing in…");
  const { data, error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  $("go").disabled = false;
  if(error){ msg(error.message === "Invalid login credentials" ? "That email and password don't match." : error.message, true); return; }
  msg(""); $("pw").value = ""; load(data.session);
});
$("out").addEventListener("click", async () => { await sb.auth.signOut(); $("grid").innerHTML = ""; msg(""); load(null); });

const { data: { session } } = await sb.auth.getSession();
load(session);
</script>
</body>
</html>
