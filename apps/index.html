<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GTALHub | Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0a0a0f;--panel:#111118;--line:#1e1e2e;--text:#f5f5f5;--muted:#8888aa;
--green:#00ff88;--cyan:#00ccff;--yellow:#ffcc00;--red:#ff5c7a;
--display:"Bebas Neue",-apple-system,BlinkMacSystemFont,sans-serif;
--mono:"Roboto Mono",ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 var(--mono);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
[hidden]{display:none!important}

nav{position:sticky;top:0;z-index:5;background:rgba(10,10,15,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-family:var(--display);font-size:30px;letter-spacing:.04em;color:var(--text);text-decoration:none}
.logo span{color:var(--green)}
.logo:hover{color:var(--green)}
.who{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:13px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:13px;cursor:pointer}
.link:hover{color:var(--green)}

h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1}
h2{font-size:48px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 36px}
section{padding:72px 0}

/* sign in */
.gate{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:40px 24px;position:relative}
.gate::before{content:"";position:absolute;inset:0;pointer-events:none;
background:radial-gradient(70% 60% at 50% 50%,rgba(0,255,136,.07) 0%,transparent 70%),
linear-gradient(rgba(0,255,136,.035) 1px,transparent 1px) 0 0/48px 48px,
linear-gradient(90deg,rgba(0,255,136,.035) 1px,transparent 1px) 0 0/48px 48px}
.box{position:relative;width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:30px}
.box::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--green),transparent)}
.box h2{font-size:40px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:11px 12px;color:var(--text);font:14px var(--mono)}
input:focus{outline:none;border-color:rgba(0,255,136,.5)}
.btn{display:inline-block;width:100%;margin-top:22px;padding:13px 22px;border:0;border-radius:4px;font:700 14px var(--mono);text-transform:uppercase;letter-spacing:.08em;
background:var(--green);color:#000;cursor:pointer;transition:box-shadow .15s}
.btn:hover{box-shadow:0 0 24px rgba(0,255,136,.4)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.msg{margin:14px 0 0;font-size:13px;color:var(--muted);min-height:1em}
.msg.err{color:var(--red)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px;
display:flex;flex-direction:column;position:relative;overflow:hidden;transition:border-color .15s,transform .15s;text-decoration:none}
.card::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--green),transparent)}
a.card:hover{border-color:rgba(0,255,136,.4);transform:translateY(-2px)}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:3px;
color:var(--cyan);background:rgba(0,204,255,.067);border:1px solid rgba(0,204,255,.333)}
.status{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.status::before{content:"●"}
.status.live{color:var(--green)}
.status.soon{color:var(--yellow)}
.card h3{font-size:32px;margin:0 0 10px}
.card p{color:var(--muted);margin:0 0 22px;flex:1;font-size:14px}
.go{font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.url{display:block;margin-top:8px;font-size:12px;color:var(--muted);word-break:break-all}
.empty{color:var(--muted)}
/* banners: a little drawn scene at the top of each card */
.banner{position:relative;margin:-26px -26px 20px;height:132px;border-bottom:1px solid var(--line);overflow:hidden;background:#0d0d14}
.banner svg{display:block;width:100%;height:100%;transition:transform .4s}
a.card:hover .banner svg{transform:scale(1.04)}
.card::before{z-index:2}
.banner .meta{position:absolute;top:14px;left:18px;right:18px;margin:0}
.banner .tag{background:rgba(10,10,15,.82)}
.banner .status{background:rgba(10,10,15,.82);padding:4px 9px;border-radius:3px}
/* categories: a row of filter chips, then one section per category */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 40px}
.chip{font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:40px;transition:border-color .15s,color .15s}
.chip b{color:var(--text);font-weight:700;margin-left:6px;opacity:.7}
.chip:hover{color:var(--text);border-color:rgba(0,255,136,.4)}
.chip.on{color:#000;background:var(--green);border-color:var(--green)}
.chip.on b{color:#000}
.chip:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.cat{margin:0 0 56px;scroll-margin-top:80px}
.cat-h{display:flex;align-items:baseline;gap:12px;font-size:34px;margin:0 0 6px}
.cat-h span{font:700 13px var(--mono);color:var(--muted);letter-spacing:.08em}
.cat-h::after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.cat-p{color:var(--muted);font-size:13px;margin:0 0 20px}
</style>
</head>
<body>

<nav>
<div class="wrap">
<a class="logo" href="/">GTAL<span>Hub</span></a>
<div class="who" id="who" hidden><span id="whoEmail"></span><button class="link" id="out" type="button">Sign out</button></div>
</div>
</nav>

<div class="gate" id="gate" hidden>
<form class="box" id="signin">
<h2>Sign in</h2>
<p class="sub" style="margin:0">The app list is for GTALHub members only.</p>
<label for="em">Email</label>
<input id="em" type="email" autocomplete="username" required>
<label for="pw">Password</label>
<input id="pw" type="password" autocomplete="current-password" required>
<button class="btn" id="go" type="submit">Sign in</button>
<p class="msg" id="msg"></p>
</form>
</div>

<main id="list" hidden>
<section>
<div class="wrap">
<h2>The Lineup</h2>
<p class="sub">Every app on GTALHub. Each one works on its own link, so you can send someone just the one they need.</p>
<div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
<div id="grid"></div>
</div>
</section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const sb = createClient("https://hjwuluhdiczmssldyeus.supabase.co", "sb_publishable_zAZpo7UDyx1eHD_HpayR-g_RRjdgtO9");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^(https:\/\/|\/)/.test(u || "") ? u : "#";

// ---- Banners: one drawn scene per app, picked by its link (falls back to a plain grid for new apps)
const SVG = (inner, defs = "") => `<svg viewBox="0 0 400 130" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs>${inner}</svg>`;
const grid = (id, size, color, op) => `<pattern id="${id}" width="${size}" height="${size}" patternUnits="userSpaceOnUse"><path d="M${size} 0H0V${size}" fill="none" stroke="${color}" stroke-opacity="${op}"/></pattern>`;
const BANNERS = {
  // Pioneer's Field Manual: a little factory line, ore riding a belt between machines
  pfm: () => SVG(`
    <rect width="400" height="130" fill="url(#pfmSky)"/><rect width="400" height="130" fill="url(#pfmGrid)"/>
    <path d="M0 60 L120 52 L260 58 L400 50" stroke="#ff9a3c" stroke-opacity=".25" fill="none"/>
    <rect y="104" width="400" height="26" fill="#1a1209"/><line y1="104" x2="400" y2="104" stroke="#ff9a3c" stroke-opacity=".45"/>
    <rect y="88" width="400" height="9" fill="#2a2a33"/>
    <line y1="96" x2="400" y2="96" stroke="#5a5a66" stroke-width="2" stroke-dasharray="3 7"><animate attributeName="stroke-dashoffset" from="10" to="0" dur=".4s" repeatCount="indefinite"/></line>
    <g><animateTransform attributeName="transform" type="translate" from="0 0" to="32 0" dur="1s" repeatCount="indefinite"/>
      ${Array.from({ length: 15 }, (_, i) => `<rect x="${i * 32 - 32}" y="81" width="8" height="7" rx="1" fill="${i % 3 ? "#ffb35c" : "#00ccff"}"/>`).join("")}</g>
    <rect x="72" y="22" width="12" height="22" fill="#2f2f39" stroke="#ff9a3c" stroke-opacity=".6"/>
    ${[0, 1, 2].map(i => `<circle cx="78" cy="18" r="4" fill="#8a8a99" opacity="0"><animate attributeName="cy" from="18" to="-6" dur="3s" begin="${i}s" repeatCount="indefinite"/><animate attributeName="r" from="4" to="11" dur="3s" begin="${i}s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;0" dur="3s" begin="${i}s" repeatCount="indefinite"/></circle>`).join("")}
    <rect x="58" y="44" width="66" height="60" rx="3" fill="#23232c" stroke="#ff9a3c"/>
    <rect x="68" y="58" width="46" height="18" rx="2" fill="#ff7a1a"><animate attributeName="opacity" values="1;.6;1;.8;1" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="160" y="32" width="80" height="72" rx="3" fill="#23232c" stroke="#ff9a3c"/>
    <g transform="translate(200 62)"><circle r="15" fill="none" stroke="#ffb35c" stroke-width="6" stroke-dasharray="4 3.85"/><circle r="9" fill="#2f2f39" stroke="#ffb35c" stroke-width="2"/><circle r="3" fill="#ffb35c"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" additive="sum"/></g>
    <rect x="276" y="48" width="66" height="56" rx="3" fill="#23232c" stroke="#ff9a3c"/>
    ${[0, 1, 2].map(i => `<rect x="${286 + i * 16}" y="60" width="12" height="4" fill="#3b3b46"/>`).join("")}
    <circle cx="330" cy="92" r="3" fill="#00ff88"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>`,
    `<linearGradient id="pfmSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1708"/><stop offset="1" stop-color="#110c09"/></linearGradient>${grid("pfmGrid", 20, "#ff9a3c", .08)}`),

  // The Weigh-Off: two people's weigh-ins racing down a chart
  weigh: () => SVG(`
    <rect width="400" height="130" fill="url(#woBg)"/><rect width="400" height="130" fill="url(#woGrid)"/>
    <line x1="50" y1="118" x2="352" y2="118" stroke="#8888aa" stroke-opacity=".5"/><line x1="50" y1="40" x2="50" y2="118" stroke="#8888aa" stroke-opacity=".5"/>
    <polyline points="50,48 90,53 130,52 170,63 210,67 250,77 290,83 330,92" fill="none" stroke="#00ccff" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="420" stroke-dashoffset="420"><animate attributeName="stroke-dashoffset" to="0" dur="2.2s" fill="freeze"/></polyline>

    ${[[330, 92, "#00ccff"], [330, 100, "#00ff88"]].map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="4" fill="${c}"/><circle cx="${x}" cy="${y}" r="4" fill="none" stroke="${c}"><animate attributeName="r" values="4;12" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>`).join("")}
    <g transform="translate(342 70)"><line y1="0" y2="40" stroke="#c9c9d6" stroke-width="2"/>
      ${[0, 1, 2, 3].map(i => [0, 1, 2].map(j => `<rect x="${1 + i * 5}" y="${j * 5}" width="5" height="5" fill="${(i + j) % 2 ? "#0a0a0f" : "#f5f5f5"}"/>`).join("")).join("")}</g>
    <text x="282" y="128" font-family="Roboto Mono, monospace" font-size="9" fill="#8888aa" opacity=".8">WK 8</text>`,
    `<linearGradient id="woBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1c16"/><stop offset="1" stop-color="#0a0a12"/></linearGradient>${grid("woGrid", 23, "#00ff88", .07)}`),

  // Aura Pack Planner: a shipping table turning into a stack of boxes

    <path d="M172 82 H204" stroke="#ffcc00" stroke-width="2.5" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" from="11" to="0" dur=".6s" repeatCount="indefinite"/></path><path d="M202 75 L212 82 L202 89" fill="none" stroke="#ffcc00" stroke-width="2.5"/>
    <rect x="220" y="116" width="134" height="4" rx="2" fill="#000" opacity=".35"/>
    ${box(222, 84, 42, 32)}${box(266, 84, 42, 32)}${box(310, 84, 42, 32)}${box(244, 54, 42, 30)}
    <g>${box(288, 54, 42, 30)}<animateTransform attributeName="transform" type="translate" values="0 -90;0 -90;0 0;0 -4;0 0;0 0" keyTimes="0;.15;.4;.48;.56;1" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;1;1;0" keyTimes="0;.15;.25;.5;.6;.92;1" dur="4s" repeatCount="indefinite"/></g>`,
    `<linearGradient id="apBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1609"/><stop offset="1" stop-color="#0d0b0a"/></linearGradient>`);
  },

  // Building Layout Builder: a blueprint floor plan with dock doors and a dimension line
  layout: () => SVG(`
    <rect width="400" height="130" fill="#08192b"/><rect width="400" height="130" fill="url(#lbFine)"/><rect width="400" height="130" fill="url(#lbBig)"/>

    `${grid("lbFine", 10, "#00ccff", .07)}${grid("lbBig", 50, "#00ccff", .16)}<pattern id="lbHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="6" stroke="#00ff88" stroke-opacity=".28" stroke-width="2"/></pattern>`),

  // Immune Response: an immune cell holding off a swarm under the microscope

    const virus = (x, y, r) => `<g transform="translate(${x} ${y})"><circle r="${r + 3}" fill="none" stroke="#ff5c7a" stroke-width="3" stroke-dasharray="1.6 2.6"/><circle r="${r}" fill="#ff5c7a"/><circle r="${r * .4}" cx="${-r * .3}" cy="${-r * .3}" fill="#ffb3c2" opacity=".6"/></g>`;

      ${virus(120, 50, 7)}${virus(290, 40, 6)}${virus(300, 98, 8)}${virus(110, 104, 6)}${virus(200, 14, 5)}</g>
    ${[[0, -130], [140, -20], [-120, 40]].map(([dx, dy], i) => `<circle r="3" fill="#00ccff"><animateMotion path="M200 68 l${dx} ${dy}" dur="1.4s" begin="${i * .45}s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="1.4s" begin="${i * .45}s" repeatCount="indefinite"/></circle>`).join("")}
    ${[[160, 96], [250, 26], [236, 108]].map(([x, y]) => `<path d="M${x} ${y - 5} L${x + 4} ${y} L${x} ${y + 5} L${x - 4} ${y} Z" fill="#00ff88"><animate attributeName="opacity" values="1;.4;1" dur="1.2s" repeatCount="indefinite"/></path>`).join("")}
    <circle cx="200" cy="68" r="32" fill="#00ccff" opacity=".08"><animate attributeName="r" values="30;36;30" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="68" r="25" fill="#cfe7ff" fill-opacity=".18" stroke="#9fdcff" stroke-width="2"/>
    <circle cx="193" cy="63" r="8" fill="#b38cff"/><circle cx="206" cy="62" r="7" fill="#b38cff"/><circle cx="200" cy="75" r="7" fill="#b38cff"/>`,

  },

  // Paver Shelf Calculator: pallets of pavers loading up a rack, with the weight on the beam
  paver: () => {
    const stack = (x, y, rows) => Array.from({ length: rows }, (_, r) => Array.from({ length: 4 }, (_, c) =>
      `<rect x="${x + c * 17 + (r % 2 ? 4 : 0)}" y="${y - (r + 1) * 9}" width="15" height="8" rx="1" fill="${["#8d8a86", "#a29c95", "#7a7570"][(r + c) % 3]}"/>`).join("")).join("")
      + `<rect x="${x - 2}" y="${y}" width="76" height="4" fill="#6b4a2a"/>`;
    return SVG(`
    <rect width="400" height="130" fill="url(#psBg)"/><rect width="400" height="130" fill="url(#psGrid)"/>
    <rect y="120" width="400" height="10" fill="#1a1a22"/>
    <g transform="translate(-34 0)"><rect x="88" y="34" width="7" height="86" fill="#ff8a1f"/><rect x="305" y="34" width="7" height="86" fill="#ff8a1f"/>

    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -150" keyTimes="0;.35;1" keySplines="0 0 1 1;.5 0 1 1" calcMode="spline" dur="4.5s" repeatCount="indefinite"/>
      <path d="M194 105 Q200 128 206 105z" fill="#ff8a1f"><animate attributeName="d" values="M194 105 Q200 124 206 105z;M193 105 Q200 132 207 105z;M194 105 Q200 124 206 105z" dur=".18s" repeatCount="indefinite"/></path>
      <path d="M196 105 Q200 116 204 105z" fill="#ffe066"/>
      <path d="M192 102 L188 108 L194 104z M208 102 L212 108 L206 104z" fill="#e8413b"/>
      <rect x="193" y="99" width="14" height="6" fill="#8d94a8"/>
      <rect x="191" y="66" width="18" height="34" rx="2" fill="#f3f5f8"/><rect x="191" y="72" width="18" height="4" fill="#e8413b"/><rect x="191" y="90" width="18" height="3" fill="#e8413b"/>
      <circle cx="200" cy="83" r="3.6" fill="#2f7cf6" stroke="#c9ced9" stroke-width="1.4"/>
      <path d="M191 66 Q191 54 200 46 Q209 54 209 66z" fill="#e8413b"/>
    </g>`, `<linearGradient id="rkSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3d8f"/><stop offset=".55" stop-color="#4a9ff0"/><stop offset="1" stop-color="#8fd3ff"/></linearGradient>`),
  // anything new without its own scene yet
  other: () => SVG(`<rect width="400" height="130" fill="#0d0d14"/><rect width="400" height="130" fill="url(#gnGrid)"/><circle cx="200" cy="72" r="34" fill="#00ff88" opacity=".08"/><path d="M182 72 h36 M200 54 v36" stroke="#00ff88" stroke-width="3" opacity=".6"/>`, grid("gnGrid", 24, "#00ff88", .08))
};
function bannerFor(a) {
  const k = `${a.url} ${a.name}`.toLowerCase();
  return (/rocket/.test(k) ? BANNERS.rocket : /stunt|rooftop/.test(k) ? BANNERS.stunt : /mirror/.test(k) ? BANNERS.mirror : /gift|exchange/.test(k) ? BANNERS.gift : /pioneer/.test(k) ? BANNERS.pfm : /weigh/.test(k) ? BANNERS.weigh : /aura|pack/.test(k) ? BANNERS.aura
    : /layout/.test(k) ? BANNERS.layout : /immune/.test(k) ? BANNERS.immune : /paver/.test(k) ? BANNERS.paver : /marble/.test(k) ? BANNERS.marble : BANNERS.other)();
}

// Older tags that now share a category
const ALIAS = { "Games": "Games & Kids", "Kids": "Games & Kids", "Games/Kids": "Games & Kids" };
const CATS = [
  { name: "Games & Kids", note: "Things to play, including ones made for little hands." },
  { name: "Game Companions", note: "Planners and guides for games we play." },
  { name: "Home & Life", note: "Family, holidays and health." },
  { name: "Work Tools", note: "Floor plans, packing lists and load math for work." }
];
// Show one category (or all of them when id is empty) and keep it in the address so a refresh stays put
function filter(id){
  const known = [...document.querySelectorAll(".cat")].some(c => c.id === id);
  if (!known) id = "";
  document.querySelectorAll(".cat").forEach(c => c.hidden = !!id && c.id !== id);
  document.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.cat === id));
  if (location.hash.slice(1) !== id) history.replaceState(null, "", id ? "#" + id : location.pathname);
}
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) filter(b.dataset.cat); });
addEventListener("hashchange", () => filter(location.hash.slice(1)));

function show(which){ $("gate").hidden = which !== "gate"; $("list").hidden = which !== "list"; }

async function load(session){
  if(!session){ $("who").hidden = true; show("gate"); return; }
  $("whoEmail").textContent = session.user.email; $("who").hidden = false;
  const { data, error } = await sb.from("hub_apps").select("name,tag,status,url,blurb").order("sort");
  if(error){ show("gate"); msg("Couldn't load the list: " + error.message, true); return; }
  if(!data.length){ show("gate"); msg("This account isn't on the GTALHub members list.", true); return; }
  const live = s => /live/i.test(s) ? "live" : "soon";
  const card = a => {
    const u = safeUrl(a.url), full = u.startsWith("/") ? location.origin + u : u;
    return `<a class="card" href="${esc(u)}">
      <div class="banner">${bannerFor(a)}<div class="meta"><span class="tag">${esc(a.tag)}</span><span class="status ${live(a.status)}">${esc(a.status)}</span></div></div>
      <h3>${esc(a.name)}</h3><p>${esc(a.blurb)}</p>
      <span class="go">Launch →</span><span class="url">${esc(full)}</span></a>`;
  };
  // Each app's tag is its category. Known categories show in this order; any new tag gets its own section at the end.
  const groups = new Map();
  for (const a of data) { const t = (a.tag || "Other").trim(), c = ALIAS[t] || t; a.tag = c; if (!groups.has(c)) groups.set(c, []); groups.get(c).push(a); }
  const cats = [...CATS.map(c => c.name).filter(n => groups.has(n)), ...[...groups.keys()].filter(n => !CATS.some(c => c.name === n))];
  const slug = n => "cat-" + n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  $("chips").innerHTML = `<button class="chip" type="button" data-cat="">All<b>${data.length}</b></button>` +
    cats.map(n => `<button class="chip" type="button" data-cat="${esc(slug(n))}">${esc(n)}<b>${groups.get(n).length}</b></button>`).join("");
  $("grid").innerHTML = cats.map(n => `<div class="cat" id="${esc(slug(n))}">
      <h3 class="cat-h">${esc(n)}<span>${groups.get(n).length}</span></h3>
      ${CATS.find(c => c.name === n) ? `<p class="cat-p">${esc(CATS.find(c => c.name === n).note)}</p>` : ""}
      <div class="grid">${groups.get(n).map(card).join("")}</div></div>`).join("");
  filter(location.hash.slice(1));
  show("list");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.querySelectorAll(".banner svg").forEach(s => s.pauseAnimations && s.pauseAnimations());
}
function msg(t, err){ $("msg").textContent = t; $("msg").classList.toggle("err", !!err); }

$("signin").addEventListener("submit", async e => {
  e.preventDefault(); $("go").disabled = true; msg("Signing in…");
  const { data, error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  $("go").disabled = false;
  if(error){ msg(error.message === "Invalid login credentials" ? "That email and password don't match." : error.message, true); return; }
  msg(""); $("pw").value = ""; load(data.session);
});
$("out").addEventListener("click", async () => { await sb.auth.signOut(); $("grid").innerHTML = ""; $("chips").innerHTML = ""; msg(""); load(null); });

const { data: { session } } = await sb.auth.getSession();
load(session);
</script>
