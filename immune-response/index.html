let G=null,P=null,eid=0,modal=null;
const st={};
const later=(t,fn)=>delayed.push({t,fn});

function wStats(w){
 const d=WEAPONS[w.id],b=d.base,c={dmg:0,area:0,cd:0,count:0,dur:0,pierce:0,spd:0};
 for(let i=0;i<w.lv-1&&i<d.ups.length;i++)c[d.ups[i]]++;
 const ev=w.evo;
 const isRot=d.type==='orbit'||d.type==='beam';
 return{
  dmg:b.dmg*(1+0.3*c.dmg)*st.might*(ev?1.8:1),
  area:b.area*(1+0.15*c.area)*st.area*(ev?1.35:1),
  cd:Math.max(0.12,b.cd*Math.pow(0.9,c.cd)*st.cd*(ev?0.75:1)),
  count:b.count+c.count+(d.type==='aura'?0:st.amount)+(ev?d.evoCount:0),
  dur:b.dur*(1+0.2*c.dur)*st.dur*(ev?1.5:1),
  pierce:b.pierce+c.pierce+st.pierce+(ev?2:0),
  spd:b.spd*(1+0.2*c.spd)*(isRot?1:st.projSpd),
 };
}
function recalc(){
 const M=G.meta,ch=CHARS[G.char],c=ch.mods||{},L=id=>G.passives[id]||0,cb=G.cb;
 st.might=M.might+(c.might||0)+0.1*L('might')+cb.might;
 st.area=M.area+(c.area||0)+0.1*L('acid');
 st.cd=Math.max(0.4,M.cd+(c.cd||0)-0.08*L('memory')+cb.cd);
 st.amount=M.amount+(c.amount||0)+L('replication');
 st.projSpd=M.projSpd+0.15*L('ribosome');
 st.dur=M.dur+0.15*L('telomere');
 st.crit=0.05+M.crit+(c.crit||0)+0.05*L('cortisol')+cb.crit;
 st.critMul=2+M.critDmg+0.25*L('histone');
 st.knock=M.knock+0.3*L('endosome');
 st.pierce=M.pierce;
 st.armor=M.armor+(ch.armor||0)+L('membrane')+cb.armor;
 const oldMax=st.maxHp||0;
 st.maxHp=Math.round((ch.hp+M.maxHp+cb.hp)*M.hpPct*(1+0.2*L('cytoplasm')));
 if(oldMax&&st.maxHp>oldMax&&P)P.hp+=st.maxHp-oldMax;
 st.regen=M.regen+(c.regen||0)+0.3*L('regen')+cb.regen;
 st.speed=150*ch.speed*(M.speed+0.1*L('flagellum')+cb.speed);
 st.magnet=70*(M.magnet+0.25*L('receptor')+cb.magnet);
 st.xp=M.xp+0.1*L('golgi')+cb.xp;
 st.luck=M.luck+0.1*L('mutagen');
 st.dnaGain=M.dnaGain+0.15*L('glycogen');
 st.curse=M.curse+0.1*L('antigen');
 st.thorns=M.thorns+15*L('peroxisome');
 const lb=L('lipid'),mb=M.barrier;
 st.shieldCd=Math.min(lb?22-3*lb:999,mb?35-5*mb:999);
 st.eliteDmg=M.eliteDmg;
 G.mawEvo=false;
 for(const w of G.weapons){w.s=wStats(w);const t=WEAPONS[w.id].type;if(w.evo&&(t==='orbit'||t==='beam'))w.t=Math.min(w.t,0.05);if(w.evo&&w.id==='aura')G.mawEvo=true}
}
const xpReq=lv=>Math.floor(5+lv*5+Math.pow(lv,1.6)*0.5);
function hpMult(){const t=G.time;return G.S.mult*(1+t/60*0.4)*(G.modes.hard?1.5:1)*(1+(st.curse-1)*0.5)*(t>600?1+(t-600)/60*0.5:1)}
function dmgMult(){return Math.pow(G.S.mult,0.7)*(1+G.time/60*0.07)*(G.modes.hard?1.3:1)}
function calcView(){const hw=W/2/SCALE,hh=H/2/SCALE,c=G.cam;G.view={l:c.x-hw,r:c.x+hw,t:c.y-hh,b:c.y+hh};G.viewR=Math.hypot(hw,hh)}

function newRun(charId,stageIdx){
 for(const k of Object.keys(st))delete st[k];
 const M=metaBonus();
 const modes={hyper:save.modes.hyper&&rank('m7')>0,endless:save.modes.endless&&rank('m8')>0,hard:save.modes.hard&&rank('m9')>0};
 G={char:charId,stageIdx,S:STAGES[stageIdx],meta:M,modes,time:0,kills:0,lv:1,xp:0,xpNext:xpReq(1),dna:0,weapons:[],passives:{},pOrder:[],banished:new Set(),
  cb:cellRunBonus(charId),pending:0,chests:0,rerolls:M.rerolls,skips:M.skips,banishes:M.banishes,revives:M.revives,wSlots:6+(rank('m12')?1:0),pSlots:6+(rank('m14')?1:0),
  spawnAcc:0,nextElite:60,ev:{},boss:null,won:false,over:false,running:true,shield:false,shieldT:0,hurt:0,startPick:rank('m16')>0,cam:{x:0,y:0},nextMini:690};
 P={x:0,y:0,r:16,hp:1,faceX:1,faceY:0,face:1,iframe:0,moving:false};
 enemies=[];proj=[];zones=[];delayed=[];fx=[];pickups=[];ebul=[];beams=[];texts=[];decals=[];G.shake=0;
 recalc();
 addWeapon(CHARS[charId].start,true);
 if(M.luckyFind){const pool=Object.keys(PASSIVES).filter(passiveUnlocked);addPassive(pick(pool))}
 recalc();P.hp=st.maxHp;G.shield=st.shieldCd<999;
 G.pending+=M.headStart+(G.startPick?1:0);
 G.sites=makeSites();G.finds=[];
 calcView();
}
function addWeapon(id,isStart){let lv=1;if(isStart)lv=Math.min(6,1+G.meta.startArsenal);else if(G.meta.mastery)lv=2;G.weapons.push({id,lv,evo:false,t:0.4,s:null,ang:0});recalc()}
function addPassive(id){G.passives[id]=1;G.pOrder.push(id);recalc()}

// ================= GRID =================
const CELL=72,grid=new Map();
const gk=(cx,cy)=>(cx+30000)*60000+(cy+30000);
function buildGrid(){grid.clear();for(const e of enemies){if(e.dead)continue;const k=gk(Math.floor(e.x/CELL),Math.floor(e.y/CELL));let a=grid.get(k);if(!a){a=[];grid.set(k,a)}a.push(e)}}
function query(x,y,r,cb){const m=r+64;const x0=Math.floor((x-m)/CELL),x1=Math.floor((x+m)/CELL),y0=Math.floor((y-m)/CELL),y1=Math.floor((y+m)/CELL);
 for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get(gk(cx,cy));if(!a)continue;for(let i=0;i<a.length;i++){const e=a[i];if(e.dead)continue;const dx=e.x-x,dy=e.y-y,rr=r+e.r;if(dx*dx+dy*dy<rr*rr){if(cb(e))return}}}}
function nearest(x,y,maxD=1e9,excl){let best=null,bd=maxD*maxD;for(const e of enemies){if(e.dead||(excl&&excl.has(e.id)))continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=e}}return best}
function nearestList(n,maxD=700){const arr=[];const m2=maxD*maxD;for(const e of enemies){if(e.dead)continue;const d=(e.x-P.x)**2+(e.y-P.y)**2;if(d<m2)arr.push([d,e])}arr.sort((a,b)=>a[0]-b[0]);return arr.slice(0,n).map(a=>a[1])}
function inView(e,m=0){const v=G.view;return e.x>v.l-m&&e.x<v.r+m&&e.y>v.t-m&&e.y<v.b+m}
function separate(){for(const a of grid.values()){const n=a.length;if(n<2)continue;for(let i=0;i<n;i++){const A=a[i];if(A.dead)continue;for(let j=i+1;j<n;j++){const B=a[j];if(B.dead)continue;const dx=B.x-A.x,dy=B.y-A.y,rr=A.r+B.r,d2=dx*dx+dy*dy;if(d2<rr*rr&&d2>0.01){const d=Math.sqrt(d2),push=(rr-d)*0.5/d;const wa=A.boss?0.1:1,wb=B.boss?0.1:1;A.x-=dx*push*wa;A.y-=dy*push*wa;B.x+=dx*push*wb;B.y+=dy*push*wb}}}}}

// ================= COMBAT =================
function hurt(e,dmg,w,sx,sy,kp){
 if(e.dead)return;
 let d=dmg,crit=false;
 if(Math.random()<st.crit){d*=st.critMul;crit=true}
 if(e.boss||e.elite)d*=st.eliteDmg;
 if(G.meta.lowHpDmg&&P.hp<st.maxHp*0.5)d*=1+G.meta.lowHpDmg;
 e.hp-=d;e.flash=0.08;sfx('hit');e.lastHit=w?w.id:null;
 if(sx!==undefined&&!e.boss&&kp){const dx=e.x-sx,dy=e.y-sy,l=Math.hypot(dx,dy)||1;const k=110*st.knock*kp*(e.elite?0.3:1);e.kvx+=dx/l*k;e.kvy+=dy/l*k}
 if(save.settings.dmgNums&&texts.length<70)texts.push({x:e.x+rand(-6,6),y:e.y-e.r,v:Math.round(d),life:0.6,crit});
 if(e.hp<=0)kill(e);
}
function heal(v){P.hp=Math.min(st.maxHp,P.hp+v)}
function nova(x,y,R,dmg,col,kp,w){query(x,y,R,e=>{hurt(e,dmg,w,x,y,kp)});fx.push({type:'ring',x,y,r0:R*0.3,r1:R,life:0.3,max:0.3,col,lw:5,fill:true})}
function shoot(o){o.vx=Math.cos(o.a)*o.spd;o.vy=Math.sin(o.a)*o.spd;if(!o.hitCd)o.hits=new Set();proj.push(o)}
function whip(sx,sy,off,s,w,col){
 const len=s.area,h=20*Math.sqrt(st.area)+(w.evo?8:0);
 const cx=P.x+sx*len/2+(sy?off:0),cy=P.y+sy*len/2+(sx?off:0);
 query(cx,cy,len/2+h,e=>{const dx=e.x-cx,dy=e.y-cy;const along=sx?Math.abs(dx):Math.abs(dy),across=sx?Math.abs(dy):Math.abs(dx);if(along<len/2+e.r&&across<h+e.r)hurt(e,s.dmg,w,P.x,P.y,0.8)});
 fx.push({type:'whip',x:cx,y:cy,sx,sy,len,h,col,life:0.2,max:0.2});
}
function fire(w){
 const s=w.s,d=WEAPONS[w.id],col=w.evo?d.evoColor:d.color;if(d.type!=='aura'&&d.type!=='orbit'&&d.type!=='beam')sfx('fire',d.type);else if(d.type!=='aura'&&!w.evo)sfx('fire',d.type);
 switch(d.type){
 case 'nova':{for(let i=0;i<s.count;i++)later(i*0.18,()=>{nova(P.x,P.y,s.area,s.dmg,col,d.knock||0.6,w);if(w.evo&&w.id==='fever')heal(1.5)});return s.cd}
 case 'aura':{query(P.x,P.y,s.area,e=>{hurt(e,s.dmg,w);if(w.evo){e.slowT=0.6;e.slowF=0.6}});return s.cd}
 case 'homing':{const tg=nearestList(s.count);for(let i=0;i<s.count;i++){const e=tg.length?tg[i%tg.length]:null;const a=(e?Math.atan2(e.y-P.y,e.x-P.x):Math.atan2(P.faceY,P.faceX))+rand(-.5,.5);
   later(i*0.06,()=>shoot({kind:'homing',x:P.x,y:P.y,a,spd:s.spd,r:s.area,dmg:s.dmg,pierce:s.pierce,life:s.dur,col,w,target:e}))}return s.cd}
 case 'orbit':{for(const p of proj)if(p.w===w)p.dead=true;
   for(let i=0;i<s.count;i++)proj.push({kind:'orbit',x:P.x,y:P.y,ang:i/s.count*TAU,orad:s.area,aspd:s.spd,r:12*Math.sqrt(st.area),dmg:s.dmg,life:w.evo?1e9:s.dur,col,w,hitCd:new Map(),hitCdT:0.5});
   return w.evo?1e9:s.cd+s.dur}
 case 'pool':{for(let i=0;i<s.count;i++){const a=Math.random()*TAU,r=i===0?0:rand(50,150);zones.push({kind:'pool',x:P.x+Math.cos(a)*r,y:P.y+Math.sin(a)*r,r:s.area,dmg:s.dmg,tick:0.5,tt:0,life:s.dur,max:s.dur,col,slow:w.evo?0.2:0.55,w})}return s.cd}
 case 'chain':{for(let i=0;i<s.count;i++){const e=nearest(P.x,P.y,650);const a=e?Math.atan2(e.y-P.y,e.x-P.x)+(i?rand(-.6,.6):0):Math.random()*TAU;
   later(i*0.1,()=>shoot({kind:'chain',x:P.x,y:P.y,a,spd:s.spd,r:s.area,dmg:s.dmg,bounce:s.pierce+(w.evo?6:0),pierce:99,life:s.dur,col,w}))}return s.cd}
 case 'whip':{for(let i=0;i<s.count;i++){const side=i%2?-P.face:P.face;const off=i>=2?(i%4<2?-30:30):0;later(i*0.12,()=>whip(side,0,off,s,w,col))}
   if(w.evo){later(0.06,()=>whip(0,-1,0,s,w,col));later(0.18,()=>whip(0,1,0,s,w,col))}return s.cd}
 case 'strike':{const cand=shuffle(enemies.filter(e=>!e.dead&&inView(e,-10)));for(let i=0;i<s.count;i++){const e=cand[i];const x=e?e.x:P.x+rand(-220,220),y=e?e.y:P.y+rand(-220,220);
   fx.push({type:'mark',x,y,r:s.area,col,life:0.45,max:0.45});later(0.45,()=>{nova(x,y,s.area,s.dmg,col,0.3,w);sfx('boom')})}return s.cd}
 case 'mine':{for(let i=0;i<s.count;i++)zones.push({kind:'mine',x:P.x+rand(-30,30),y:P.y+rand(-30,30),r:s.area,dmg:s.dmg,life:s.dur,max:s.dur,col,charges:w.evo?4:1,arm:0.3,w});return s.cd}
 case 'wave':{for(let i=0;i<s.count;i++)later(i*0.28,()=>zones.push({kind:'wave',x:P.x,y:P.y,r:10,rmax:s.area,dmg:s.dmg,life:0.6,max:0.6,col,hit:new Set(),w}));return s.cd}
 case 'spear':{const base=Math.atan2(P.faceY,P.faceX);for(let i=0;i<s.count;i++){const a=base+(i-(s.count-1)/2)*0.14;shoot({kind:'spear',x:P.x,y:P.y,a,spd:s.spd,r:s.area,dmg:s.dmg,pierce:s.pierce,life:s.dur,col,w})}return s.cd}
 case 'beam':{beams=beams.filter(b=>b.w!==w);const off=Math.random()*TAU;for(let i=0;i<s.count;i++)beams.push({ang:off+i/s.count*TAU,len:s.area,life:w.evo?1e9:s.dur,aspd:s.spd,dmg:s.dmg,tt:0,col,w,wid:9*Math.sqrt(st.area)});return w.evo?1e9:s.cd+s.dur}
 case 'lightning':{const hit=new Set();const chains=w.evo?2:1;for(let c=0;c<chains;c++){let x=P.x,y=P.y;const pts=[[x,y]];for(let j=0;j<s.count;j++){const e=nearest(x,y,j===0?s.area*1.6:s.area,hit);if(!e)break;hit.add(e.id);hurt(e,s.dmg,w);x=e.x;y=e.y;pts.push([x,y])}if(pts.length>1)fx.push({type:'bolt',pts,col,life:0.22,max:0.22})}return s.cd}
 case 'boomerang':{const e=nearest(P.x,P.y,500);const base=e?Math.atan2(e.y-P.y,e.x-P.x):Math.atan2(P.faceY,P.faceX);for(let i=0;i<s.count;i++){const a=w.evo?base+i/s.count*TAU:base+(i-(s.count-1)/2)*0.5;
   shoot({kind:'boom',x:P.x,y:P.y,a,spd:s.spd,r:s.area,dmg:s.dmg,life:s.dur*2+2,t:0,out:s.dur,col,w,hitCd:new Map(),hitCdT:0.4,rot:0})}return s.cd}
 case 'bouncer':{for(let i=0;i<s.count;i++)shoot({kind:'bounce',x:P.x,y:P.y,a:Math.random()*TAU,spd:s.spd,r:s.area*(w.evo?1.4:1),dmg:s.dmg,life:s.dur,col,w,hitCd:new Map(),hitCdT:0.35});return s.cd}
 case 'spiral':{w.ang+=0.55;for(let i=0;i<s.count;i++){const a=w.ang+i/s.count*TAU;shoot({kind:'shard',x:P.x,y:P.y,a,spd:s.spd,r:s.area,dmg:s.dmg,pierce:s.pierce,life:s.dur,col,w});if(w.evo)shoot({kind:'shard',x:P.x,y:P.y,a:-a,spd:s.spd,r:s.area,dmg:s.dmg,pierce:s.pierce,life:s.dur,col,w})}return s.cd}
 case 'lob':{const cand=enemies.filter(e=>!e.dead&&(e.x-P.x)**2+(e.y-P.y)**2<380*380);for(let i=0;i<s.count;i++){const e=cand.length?pick(cand):null;const tx=e?e.x:P.x+rand(-200,200),ty=e?e.y:P.y+rand(-200,200);
   fx.push({type:'lob',x0:P.x,y0:P.y,x1:tx,y1:ty,col,life:0.55,max:0.55});later(0.55,()=>zones.push({kind:'pool',acid:true,x:tx,y:ty,r:s.area,dmg:s.dmg,tick:0.4,tt:0,life:s.dur,max:s.dur,col,slow:0,w}))}return s.cd}
 case 'spread':{const e=nearest(P.x,P.y,420);const base=e?Math.atan2(e.y-P.y,e.x-P.x):Math.atan2(P.faceY,P.faceX);const n=w.evo?s.count*3:s.count;
   for(let i=0;i<n;i++){const a=w.evo?base+i/n*TAU:base+(n>1?(i/(n-1)-0.5)*0.8:0);shoot({kind:'pellet',x:P.x,y:P.y,a:a+rand(-.04,.04),spd:s.spd*rand(.9,1.1),r:s.area,dmg:s.dmg,pierce:s.pierce,life:s.dur,col,w})}return s.cd}
 case 'snipe':{const cand=enemies.filter(e=>!e.dead&&inView(e,0)).sort((a,b)=>b.hp-a.hp);for(let i=0;i<s.count;i++){const e=cand[i];if(!e)break;fx.push({type:'cross',e,col,life:0.7,max:0.7});later(0.7,()=>{if(!e.dead){const x=e.x,y=e.y;hurt(e,s.dmg,w);fx.push({type:'ring',x,y,r0:4,r1:s.area,life:0.25,max:0.25,col,lw:4})}})}return s.cd}
 }
 return 1;
}
function damagePlayer(raw){
 if(P.iframe>0||G.over)return;
 if(G.shield){sfx('shield');G.shield=false;G.shieldT=st.shieldCd;P.iframe=0.6;fx.push({type:'ring',x:P.x,y:P.y,r0:20,r1:60,life:0.35,max:0.35,col:'#e0aaff',lw:4});return}
 const d=Math.max(1,raw-st.armor);P.hp-=d;sfx('hurt');G.shake=Math.max(G.shake,5);P.iframe=0.45+G.meta.iframe;G.hurt=0.25;
 if(P.hp<=0){if(G.revives>0){G.revives--;P.hp=st.maxHp*0.5;P.iframe=2.5;bomb();toast('Revived!')}else{P.hp=0;endRun(false)}}
}
function contact(e,dm){if(st.thorns>0&&e.thornT<=0){e.thornT=0.5;hurt(e,st.thorns*st.might,null)}if(e.dead||P.iframe>0)return;damagePlayer(e.dmg*dm*(e.boss?G.meta.bossDR:1))}
function bomb(){sfx('bomb');G.shake=Math.max(G.shake,14);for(const e of enemies){if(e.dead||!inView(e,40))continue;if(e.boss)hurt(e,600,null);else kill(e)}fx.push({type:'ring',x:P.x,y:P.y,r0:20,r1:G.viewR,life:0.5,max:0.5,col:'#ffffff',lw:10})}
function drop(k,x,y,v=1){pickups.push({k,x,y,v,mag:false,sp:0})}
function dropGem(x,y,v){let n=0;for(const p of pickups)if(p.k==='xp')n++;if(n>450){const gems=pickups.filter(p=>p.k==='xp'&&!p.mag);if(gems.length){pick(gems).v+=v;return}}drop('xp',x,y,v)}
function kill(e){
 if(e.dead)return;e.dead=true;G.kills++;if(e.guard){e.guard.left--;e.guard=null}sfx(e.boss||e.elite?'killBig':'kill');if(decals.length>90)decals.shift();decals.push({x:e.x,y:e.y,r:e.r*rand(1.1,1.6),col:e.color,v:e.id%3,rot:Math.random()*TAU,born:G.time});if(fx.length<300)fx.push({type:'ring',x:e.x,y:e.y,r0:e.r*0.4,r1:e.r*1.7,life:0.22,max:0.22,col:e.color,lw:3});if(e.elite)G.shake=Math.max(G.shake,5);if(e.boss)G.shake=Math.max(G.shake,14);
 dropGem(e.x,e.y,e.xp);
 if(fx.length<300)for(let i=0;i<4;i++){const a=Math.random()*TAU,s=rand(40,140);fx.push({type:'dot',x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(2,4)*(e.r/10),col:e.color,life:0.4,max:0.4})}
 if(e.split&&!e.small)for(let i=0;i<2;i++)makeEnemy(e.type,{x:e.x+rand(-10,10),y:e.y+rand(-10,10),small:true});
 if(e.boss){for(let i=0;i<(e.final?12:5);i++)drop('dna',e.x+rand(-50,50),e.y+rand(-50,50),2);drop('chest',e.x,e.y);fx.push({type:'ring',x:e.x,y:e.y,r0:10,r1:260,life:0.7,max:0.7,col:e.color,lw:10});
  if(G.boss===e){G.boss=null;MUS.boss=false;if(!G.won||G.modes.endless)setMusic('run')}

function updProj(dt){
 const v=G.view;
 for(const p of proj){
  if(p.dead)continue;

  switch(p.kind){
   case 'orbit':p.ang+=p.aspd*dt;p.x=P.x+Math.cos(p.ang)*p.orad;p.y=P.y+Math.sin(p.ang)*p.orad;break;
   case 'homing':{if(!p.target||p.target.dead)p.target=nearest(p.x,p.y,500);if(p.target){const ta=Math.atan2(p.target.y-p.y,p.target.x-p.x);let ca=Math.atan2(p.vy,p.vx);let da=((ta-ca)%TAU+TAU*1.5)%TAU-Math.PI;ca+=clamp(da,-7*dt,7*dt);p.vx=Math.cos(ca)*p.spd;p.vy=Math.sin(ca)*p.spd}p.x+=p.vx*dt;p.y+=p.vy*dt;break}
   case 'boom':{p.t+=dt;p.rot+=14*dt;if(p.t<p.out){const kk=1-p.t/p.out;p.x+=p.vx*kk*dt*1.6;p.y+=p.vy*kk*dt*1.6}else{const dx=P.x-p.x,dy=P.y-p.y,d=Math.hypot(dx,dy)||1;const sp=p.spd*Math.min(1.7,0.3+(p.t-p.out)*2.2);p.x+=dx/d*sp*dt;p.y+=dy/d*sp*dt;if(d<22)p.dead=true}break}
   case 'bounce':{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<v.l){p.x=v.l;p.vx=Math.abs(p.vx)}if(p.x>v.r){p.x=v.r;p.vx=-Math.abs(p.vx)}if(p.y<v.t){p.y=v.t;p.vy=Math.abs(p.vy)}if(p.y>v.b){p.y=v.b;p.vy=-Math.abs(p.vy)}break}
   default:p.x+=p.vx*dt;p.y+=p.vy*dt;
  }

   if(p.dead)return true;
   if(p.hitCd){const l=p.hitCd.get(e.id);if(l!==undefined&&G.time-l<p.hitCdT)return false;p.hitCd.set(e.id,G.time);hurt(e,p.dmg,p.w,p.x,p.y,0.5);return false}

   if(p.kind==='chain'){p.bounce--;if(p.bounce<0){p.dead=true;return true}const n=nearest(p.x,p.y,320,p.hits);if(!n){p.dead=true;return true}const a=Math.atan2(n.y-p.y,n.x-p.x);p.vx=Math.cos(a)*p.spd;p.vy=Math.sin(a)*p.spd;p.life=Math.max(p.life,1);return true}
   p.pierce--;if(p.pierce<0){p.dead=true;return true}return false});

   case 'blob':{const q=Math.sin(e.t*3)*0.09;sx=1+q;sy=1-q;rot=e.rot+Math.sin(e.t*0.7)*0.3;break}

 $('#xpfill').style.width=clamp(G.xp/G.xpNext*100,0,100).toFixed(1)+'%';
 setText('lvl',String(G.lv));setText('timer',fmtTime(G.time));setText('kills',String(G.kills));setText('dnaHud',String(Math.floor(G.dna)));

let curChoices=[],banishMode=false;
function genChoices(onlyW){
 const opts=[];
 if(!onlyW){for(const w of G.weapons)if(!w.evo&&w.lv<6)opts.push([{k:'w',id:w.id},3]);for(const id of G.pOrder)if(G.passives[id]<PASSIVES[id].max)opts.push([{k:'p',id},2.5])}
 if(G.weapons.length<G.wSlots)for(const id in WEAPONS)if(weaponUnlocked(id)&&!G.weapons.some(w=>w.id===id)&&!G.banished.has(id))opts.push([{k:'w',id},onlyW?1:1.4]);
 if(!onlyW&&G.pOrder.length<G.pSlots)for(const id in PASSIVES)if(passiveUnlocked(id)&&!G.passives[id]&&!G.banished.has(id))opts.push([{k:'p',id},1.2]);
 let n=Math.min(5,G.meta.choices+(Math.random()<(st.luck-1)*0.5?1:0));
 const out=[];
 while(out.length<n&&opts.length){const o=wpick(opts);out.push(o[0]);opts.splice(opts.indexOf(o),1)}
 if(!out.length)out.push({k:'heal'},{k:'dna'});
 return out;
}
function choiceHTML(c,i){
 let icon='',name='',tag='',desc='',hint='',isNew=false;
 if(c.k==='w'){const d=WEAPONS[c.id],w=G.weapons.find(x=>x.id===c.id);icon=wIcon(c.id);name=d.name;if(!w){isNew=true;tag='NEW';desc=d.desc}else{tag='LV '+(w.lv+1);desc=UPTXT[d.ups[w.lv-1]]+(w.lv+1===evoLv()?' · Max level':'')}
  if(rank('m10'))hint=`Evolves into ${d.evoName} with ${PASSIVES[d.evo].name}`}
 else if(c.k==='p'){const d=PASSIVES[c.id],lv=G.passives[c.id]||0;icon=pIcon(c.id);name=d.name;isNew=!lv;tag=lv?'LV '+(lv+1):'NEW';desc=d.desc;
  if(rank('m10')){const ws=Object.keys(WEAPONS).filter(k=>WEAPONS[k].evo===c.id&&weaponUnlocked(k));if(ws.length)hint='Evolves '+ws.map(k=>WEAPONS[k].name).join(', ')}}
 else if(c.k==='heal'){icon=`<svg viewBox="0 0 24 24"><path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z" fill="#3ccf91"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="3"/></svg>`;name='Glucose';desc='Restore 40 HP'}
 else{icon=DNA_SVG;name='DNA Fragment';desc='+5 DNA'}
 return `<button class="card ${c.k==='p'?'pas':c.k==='w'?'':'misc'} ${banishMode&&(c.k==='w'||c.k==='p')?'ban':''}" data-a="choose" data-v="${i}"><div class="ib">${icon}</div><div><div class="nm">${name}${tag?`<span class="tg ${isNew?'new':''}">${tag}</span>`:''}</div><div class="ds">${desc}</div>${hint?`<div class="ht">${hint}</div>`:''}</div></button>`;
}
function showLevelUp(regen=true){

 show(`<div class="panel"><h2>${t}</h2><span class="lbl c">Culture level ${G.lv} · choose a mutation</span>${banishMode?'<div class="hint" style="margin:-6px auto 10px;color:#ff8fa3">Tap an item to banish it for this run</div>':''}<div class="cards">${curChoices.map(choiceHTML).join('')}</div>
 <div class="row"><button class="btn" data-a="reroll" ${G.rerolls>0?'':'disabled'}>Reroll (${G.rerolls})</button><button class="btn" data-a="skip" ${G.skips>0&&!G.startPick?'':'disabled'}>Skip (${G.skips})</button><button class="btn" data-a="banish" ${G.banishes>0?'':'disabled'}>${banishMode?'Cancel':'Banish'} (${G.banishes})</button></div></div>`,'modal');
}
function choose(i){
 const c=curChoices[i];if(!c)return;
 if(banishMode){if(c.k!=='w'&&c.k!=='p')return;G.banished.add(c.id);G.banishes--;banishMode=false;curChoices.splice(i,1);if(!curChoices.length)curChoices=genChoices(G.startPick);showLevelUp(false);return}
 if(c.k==='w'){const w=G.weapons.find(x=>x.id===c.id);if(w){w.lv++;recalc()}else addWeapon(c.id)}
 else if(c.k==='p'){if(G.passives[c.id]){G.passives[c.id]++;recalc()}else addPassive(c.id)}
 else if(c.k==='heal')heal(40);
 else G.dna+=5;
 G.pending--;G.startPick=false;renderItemsHud();nextModal();
}

function openChest(){
 modal='chest';
 const M=G.meta,L=st.luck,r=Math.random();
 const p5=0.03*L+(rank('m11')?0.05:0)+0.03*M.treasure,p3=0.12*L+(rank('m11')?0.12:0)+0.08*M.treasure;
 const n=r<p5?5:r<p5+p3?3:1;
 const res=[];
 for(let i=0;i<n;i++){
  const ev=G.weapons.find(w=>!w.evo&&w.lv>=evoLv()&&G.passives[WEAPONS[w.id].evo]);
  if(ev){ev.evo=true;ev.lv=Math.max(ev.lv,6);ev.t=0;recalc();res.push(`<div class="res evo">${wIcon(ev.id,true)}<div><b>${WEAPONS[ev.id].evoName}</b><br><small>${WEAPONS[ev.id].evoDesc}</small></div></div>`);continue}
  const up=[];for(const w of G.weapons)if(!w.evo&&w.lv<6)up.push(['w',w]);for(const id of G.pOrder)if(G.passives[id]<PASSIVES[id].max)up.push(['p',id]);
  if(up.length){const u=pick(up);if(u[0]==='w'){u[1].lv++;res.push(`<div class="res">${wIcon(u[1].id)}<div>${WEAPONS[u[1].id].name} → LV ${u[1].lv}</div></div>`)}else{G.passives[u[1]]++;res.push(`<div class="res">${pIcon(u[1])}<div>${PASSIVES[u[1]].name} → LV ${G.passives[u[1]]}</div></div>`)}recalc();continue}
  const v=10*st.dnaGain;G.dna+=v;res.push(`<div class="res">${DNA_SVG}<div>+${Math.floor(v)} DNA</div></div>`);
 }
 renderItemsHud();sfx(res.some(r=>r.includes('res evo'))?'evolve':'chest');
 show(`<div class="panel"><h2>${n>1?n+'× Chest!':'Chest'}</h2>${res.join('')}<div class="row"><button class="btn big" data-a="chestOk">Continue</button></div></div>`,'modal');
}

// ---- DNA lab ----
const POS={};
(function layout(){
 const kids={};for(const n of TREE){const p=n[2]||('root_'+n[1]);(kids[p]=kids[p]||[]).push(n[0])}
 const leaves=id=>{const k=kids[id];if(!k)return 1;return k.reduce((s,c)=>s+leaves(c),0)};
 const place=(id,a0,a1,depth)=>{const a=(a0+a1)/2,R=50+depth*100;POS[id]={x:Math.cos(a)*R,y:Math.sin(a)*R,d:depth};const k=kids[id];if(!k)return;const tot=leaves(id);let cur=a0;for(const c of k){const span=(a1-a0)*leaves(c)/tot;place(c,cur,cur+span,depth+1);cur+=span}};
 for(const b in BRANCHES){const a=BRANCHES[b].angle*Math.PI/180,half=44*Math.PI/180;for(const r of kids['root_'+b])place(r,a-half,a+half,1)}
})();
let labSel=null,labZoom=1,refundArm=false,resetArm=false;
function treeSVG(){
 let lines='',nodes='',labels='';
 for(const n of TREE){const id=n[0],N=TN[id],p=POS[id],pp=N.par?POS[N.par]:{x:0,y:0},col=BRANCHES[N.br].color,av=nodeAvail(N),rk=rank(id);
  lines+=`<line x1="${pp.x}" y1="${pp.y}" x2="${p.x}" y2="${p.y}" stroke="${av?col:'#3a4a62'}" stroke-width="${rk?4:2.5}" opacity="${rk?0.9:av?0.55:0.35}"/>`;
  const maxed=rk>=N.max,afford=save.dna>=nodeCost(N);
  const fill=maxed?col:rk?mix(col,'#0e1524',0.45):'#0e1524',stroke=av?col:'#3a4a62';
  nodes+=`<g class="node" data-a="node" data-v="${id}">${labSel===id?`<circle cx="${p.x}" cy="${p.y}" r="27" fill="none" stroke="#fff" stroke-width="2.5"/>`:''}${av&&!maxed&&afford?`<circle cx="${p.x}" cy="${p.y}" r="24" fill="none" stroke="${col}" stroke-width="1.5" opacity=".5"><animate attributeName="r" values="21;26;21" dur="2s" repeatCount="indefinite"/></circle>`:''}<circle cx="${p.x}" cy="${p.y}" r="20" fill="${fill}" stroke="${stroke}" stroke-width="3" opacity="${av?1:0.5}"/><text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="14" font-family="Lilita One,sans-serif" fill="${maxed?'#0e1524':'#fff'}" opacity="${av?1:0.6}">${av?rk+'/'+N.max:''}</text>${av?'':`<g transform="translate(${p.x-6},${p.y-8})" opacity=".7"><rect x="0" y="7" width="12" height="9" rx="2" fill="#8ea3bd"/><path d="M3 7V5a3 3 0 0 1 6 0v2" stroke="#8ea3bd" stroke-width="2" fill="none"/></g>`}</g>`;
  labels+=`<text x="${p.x}" y="${p.y+36}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono,monospace" font-weight="600" fill="#cfe0f2" opacity="${av?0.9:0.45}" pointer-events="none">${N.name}</text>`;
 }
 let br='';for(const b in BRANCHES){const B=BRANCHES[b],a=B.angle*Math.PI/180;br+=`<text x="${Math.cos(a)*60}" y="${Math.sin(a)*60+4}" text-anchor="middle" font-size="12" font-weight="700" fill="${B.color}" letter-spacing="1">${B.name.toUpperCase()}</text>`}
 return `<defs><radialGradient id="nuc"><stop offset="0" stop-color="#ff8fa3"/><stop offset="1" stop-color="#6b2b7a"/></radialGradient></defs>
 <circle cx="0" cy="0" r="760" fill="none" stroke="#ffffff10" stroke-width="2"/><circle cx="0" cy="0" r="450" fill="none" stroke="#ffffff08" stroke-width="2"/>
 ${lines}<circle cx="0" cy="0" r="40" fill="url(#nuc)" stroke="#ffb3c1" stroke-width="3"/><text x="0" y="-4" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">DNA</text><text x="0" y="14" text-anchor="middle" font-size="15" font-weight="700" fill="#ffd166">${Math.floor(save.dna)}</text>${br}${nodes}${labels}`;
}
function detailHTML(){
 if(!labSel){const spent=TREE.reduce((s,n)=>s+n[6]*rank(n[0])*(rank(n[0])+1)/2,0);return `<div class="dt"><h3>Permanent upgrades</h3><p>Spend DNA from your runs. Each node unlocks the ones branching out from it. ${spent?`You’ve spent ${spent} DNA so far.`:''}</p></div>${spent?`<button class="btn sm" data-a="refund">${refundArm?'Tap again to refund':'Refund all'}</button>`:''}`}
 const N=TN[labSel],rk=rank(labSel),B=BRANCHES[N.br],maxed=rk>=N.max,av=nodeAvail(N),cost=nodeCost(N);
 return `<div class="dt"><div class="br" style="color:${B.color}">${B.name}</div><h3>${N.name} <small style="color:var(--mut)">${rk}/${N.max}</small></h3><p>${N.desc}${N.max>1?' (per rank)':''}</p>${!av?`<p style="color:var(--gold)">Requires ${TN[N.par].name}</p>`:''}</div>
 ${maxed?'<b style="color:var(--good)">Maxed</b>':`<button class="btn big" data-a="buy" ${av&&save.dna>=cost?'':'disabled'} style="width:auto">${DNA_SVG.replace('<svg','<svg width="16" height="16" style="vertical-align:-2px"')} ${cost}</button>`}`;
}

 <div class="labbody"><div class="zoom"><button data-a="zoom" data-v="1.25">+</button><button data-a="zoom" data-v="0.8">−</button></div><div class="treewrap" id="tw"><svg id="tree" viewBox="-800 -800 1600 1600"></svg></div></div>
 <div class="detail" id="detail"></div></div>`,'full');
 const tw=$('#tw');labZoom=Math.min(tw.clientWidth,tw.clientHeight)<700?0.8:clamp(Math.min(tw.clientWidth,tw.clientHeight)/1500,0.45,1);
 renderLab(true);labInput(tw);

// mouse wheel zooms toward the cursor, dragging the background pans, clicking empty map clears the selection
function labInput(tw){
 const minZ=()=>Math.min(tw.clientWidth,tw.clientHeight)/TREE_SZ*0.95;
 tw.addEventListener('wheel',e=>{e.preventDefault();const r=tw.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,fx=(tw.scrollLeft+mx)/(TREE_SZ*labZoom),fy=(tw.scrollTop+my)/(TREE_SZ*labZoom);
  labZoom=clamp(labZoom*Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0015)),minZ(),2);renderLab(false);tw.scrollLeft=fx*TREE_SZ*labZoom-mx;tw.scrollTop=fy*TREE_SZ*labZoom-my},{passive:false});
 let drag=null,moved=false;
 tw.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;drag={x:e.clientX,y:e.clientY,sl:tw.scrollLeft,st:tw.scrollTop};moved=false});

async function cloudSync(user){
 CLOUD.user=user;CLOUD.state='syncing';cloudChip();
