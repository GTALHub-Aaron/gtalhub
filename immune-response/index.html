function updZones(dt){

function updEnemies(dt){

  if(e.guard&&!e.aggro){if(d<430||e.hp<e.maxhp)e.aggro=true;else{const hx=e.hx+Math.cos(e.t*0.6+e.id)*30-e.x,hy=e.hy+Math.sin(e.t*0.6+e.id)*30-e.y,hl=Math.hypot(hx,hy)||1;dx=hx/hl;dy=hy/hl;sp=Math.min(sp*0.4,hl*2)}}

// menu background follows the level whose music is playing (title -> first level, boss keeps the current one)
const MBG={cur:0,want:0,fade:0,lt:0};
function mbgWant(){const nm=MX.cur>=0?MX.els[MX.cur].name:MX.buf&&MX.buf.name;if(!nm||MX.cur<0&&!MX.buf)return MBG.want;
 for(const k in PLAYLIST)if(PLAYLIST[k].includes(nm)){if(k==='title')return 0;if(k==='boss')return MBG.want;const i=STAGES.findIndex(s=>s.deco.kind===k);return i>=0?i:MBG.want}return MBG.want}
function menuBg(t){
 const dt=Math.min(0.1,Math.max(0,t-MBG.lt));MBG.lt=t;MBG.want=mbgWant();
 if(MBG.want!==MBG.cur){MBG.fade=Math.min(1,MBG.fade+dt*3.5);if(MBG.fade>=1)MBG.cur=MBG.want}else MBG.fade=Math.max(0,MBG.fade-dt*3.5);
 const S=STAGES[MBG.cur],cx=t*24,cy=t*9;drawBg(S,cx,cy,SCALE,t);
 ctx.setTransform(DPR*SCALE,0,0,DPR*SCALE,DPR*(W/2-cx*SCALE),DPR*(H/2-cy*SCALE));
 const ids=Object.keys(CHARS),R=Math.min(W,H)/SCALE*0.52;
 ids.forEach((id,i)=>{const a=i/ids.length*TAU+t*0.07,x=cx+Math.cos(a)*R*(1+0.12*Math.sin(t*0.5+i)),y=cy+Math.sin(a)*R*0.95+Math.sin(t*0.9+i*2)*12,lx=Math.cos(a+1.8),ly=Math.sin(a+1.8);
  ctx.globalAlpha=0.35;shadow(x,y,21);ctx.globalAlpha=0.6;glow(x,y,48,CHARS[id].color,0.12);ctx.globalAlpha=0.6;blit(playerSpr(id),x,y,Math.sin(t+i)*0.12,1.3,1.3);const ey=id==='phage'?y-8.3:y-2;drawEye(ctx,x-6.7,ey,5.6,lx,ly);drawEye(ctx,x+6.7,ey,5.6,lx,ly);ctx.globalAlpha=1});
 drawMotes(S,cx,cy,t);post();
 if(MBG.fade>0){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=MBG.fade;ctx.fillStyle='#05070d';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}

// ---- level up ----
let curChoices=[],banishMode=false;
function genChoices(onlyW){
 const opts=[];
 if(!onlyW){for(const w of G.weapons)if(!w.evo&&w.lv<6)opts.push([{k:'w',id:w.id},3]);for(const id of G.pOrder)if(G.passives[id]<PASSIVES[id].max)opts.push([{k:'p',id},2.5])}
 if(G.weapons.length<G.wSlots)for(const id in WEAPONS)if(weaponUnlocked(id)&&!G.weapons.some(w=>w.id===id)&&!G.banished.has(id))opts.push([{k:'w',id},onlyW?1:1.4]);
 if(!onlyW&&G.pOrder.length<G.pSlots)for(const id in PASSIVES)if(passiveUnlocked(id)&&!G.passives[id]&&!G.banished.has(id))opts.push([{k:'p',id},1.2]);
 let n=Math.min(5,G.meta.choices+(Math.random()<(st.luck-1)*0.5?1:0));
 const out=[];
 while(out.length<n&&opts.length){const o=wpick(opts);out.push(o[0]);opts.splice(opts.indexOf(o),1)}
 if(!out.length)out.push({k:'heal'},{k:'dna'});
 return out;
}
function choiceHTML(c,i){
 let icon='',name='',tag='',desc='',hint='',isNew=false;
 if(c.k==='w'){const d=WEAPONS[c.id],w=G.weapons.find(x=>x.id===c.id);icon=wIcon(c.id);name=d.name;if(!w){isNew=true;tag='NEW';desc=d.desc}else{tag='LV '+(w.lv+1);desc=UPTXT[d.ups[w.lv-1]]+(w.lv+1===evoLv()?' · Max level':'')}
  if(rank('m10'))hint=`Evolves into ${d.evoName} with ${PASSIVES[d.evo].name}`}
 else if(c.k==='p'){const d=PASSIVES[c.id],lv=G.passives[c.id]||0;icon=pIcon(c.id);name=d.name;isNew=!lv;tag=lv?'LV '+(lv+1):'NEW';desc=d.desc;
  if(rank('m10')){const ws=Object.keys(WEAPONS).filter(k=>WEAPONS[k].evo===c.id&&weaponUnlocked(k));if(ws.length)hint='Evolves '+ws.map(k=>WEAPONS[k].name).join(', ')}}
 else if(c.k==='heal'){icon=`<svg viewBox="0 0 24 24"><path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z" fill="#3ccf91"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="3"/></svg>`;name='Glucose';desc='Restore 40 HP'}
 else{icon=DNA_SVG;name='DNA Fragment';desc='+5 DNA'}
 return `<button class="card ${c.k==='p'?'pas':c.k==='w'?'':'misc'} ${banishMode&&(c.k==='w'||c.k==='p')?'ban':''}" data-a="choose" data-v="${i}"><div class="ib">${icon}</div><div><div class="nm">${name}${tag?`<span class="tg ${isNew?'new':''}">${tag}</span>`:''}</div><div class="ds">${desc}</div>${hint?`<div class="ht">${hint}</div>`:''}</div></button>`;
}
function showLevelUp(regen=true){
 modal='level';
 if(regen){curChoices=genChoices(G.startPick);banishMode=false;sfx('level')}
 const t=G.startPick?'Choose a second weapon':'Level up!';
 show(`<div class="panel"><h2>${t}</h2><span class="lbl c">Culture level ${G.lv} · choose a mutation</span>${banishMode?'<div class="hint" style="margin:-6px auto 10px;color:#ff8fa3">Tap an item to banish it for this run</div>':''}<div class="cards">${curChoices.map(choiceHTML).join('')}</div>
 <div class="row"><button class="btn" data-a="reroll" ${G.rerolls>0?'':'disabled'}>Reroll (${G.rerolls})</button><button class="btn" data-a="skip" ${G.skips>0&&!G.startPick?'':'disabled'}>Skip (${G.skips})</button><button class="btn" data-a="banish" ${G.banishes>0?'':'disabled'}>${banishMode?'Cancel':'Banish'} (${G.banishes})</button></div></div>`,'modal');
}
function choose(i){
 const c=curChoices[i];if(!c)return;
 if(banishMode){if(c.k!=='w'&&c.k!=='p')return;G.banished.add(c.id);G.banishes--;banishMode=false;curChoices.splice(i,1);if(!curChoices.length)curChoices=genChoices(G.startPick);showLevelUp(false);return}
 if(c.k==='w'){const w=G.weapons.find(x=>x.id===c.id);if(w){w.lv++;recalc()}else addWeapon(c.id)}
 else if(c.k==='p'){if(G.passives[c.id]){G.passives[c.id]++;recalc()}else addPassive(c.id)}
 else if(c.k==='heal')heal(40);
 else G.dna+=5;
 G.pending--;G.startPick=false;renderItemsHud();nextModal();
}
function nextModal(){
 if(!G||G.over)return;
 if(G.finds&&G.finds.length){showFind(G.finds.shift());return}
 if(G.chests>0){G.chests--;openChest();return}
 if(G.pending>0){showLevelUp();return}
 closeModal();
}
function openChest(){
 modal='chest';
 const M=G.meta,L=st.luck,r=Math.random();
 const p5=0.03*L+(rank('m11')?0.05:0)+0.03*M.treasure,p3=0.12*L+(rank('m11')?0.12:0)+0.08*M.treasure;
 const n=r<p5?5:r<p5+p3?3:1;
 const res=[];
 for(let i=0;i<n;i++){

async function cloudSync(user){

 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}

 try{
  let c;try{c=new AC({latencyHint:'interactive'})}catch(_){c=new AC()}AU.ctx=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=0.004;comp.release.value=0.25;comp.connect(c.destination);

}
function impulse(c,dur,decay){const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}

 const c=AU.ctx,os=c.createOscillator();os.type=type;os.frequency.setValueAtTime(freq,t);
 if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+(o.slideT||len));if(o.detune)os.detune.value=o.detune;
 const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+(o.a||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+len);

 const f=c.createBiquadFilter();f.type=o.filter||'bandpass';f.frequency.setValueAtTime(o.ff||1000,t);if(o.ffEnd)f.frequency.exponentialRampToValueAtTime(o.ffEnd,t+len);f.Q.value=o.q||1;
