<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mirror Magic">
<meta name="theme-color" content="#ffcf33">
<title>Mirror Magic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful crayon-box toy, chunky and friendly, made for small fingers
   IDEA: a kaleidoscope sketchpad - paper inside a sunny toy frame
   PICTURE: the drawing surface itself, edge to edge, with mirror lines and draggable knobs
   COLOR and TYPE: sunny yellow frame, white chunky buttons with dark outlines, hot pink accent; Baloo 2
   LAYOUT: thin top bar (symmetry + actions), big paper, bottom dock (brushes, colors, size) */
:root{color-scheme:light;--frame:#ffcf33;--ink:#2b1d0e;--hot:#ff3d8b;--btn:#fff;--paper:#fff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--frame);color:var(--ink);font:600 16px/1.2 "Baloo 2",ui-rounded,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
header,footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{font-weight:800;font-size:24px;letter-spacing:-.01em;margin-right:4px;white-space:nowrap}
.brand span{color:var(--hot)}
button{font:inherit;color:var(--ink);background:var(--btn);border:3px solid var(--ink);border-radius:14px;min-height:46px;min-width:46px;padding:0 14px;box-shadow:0 3px 0 var(--ink);touch-action:manipulation;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
button.on{background:var(--hot);color:#fff}
button:disabled{opacity:.4}
.ic{width:58px;height:58px;padding:0;display:grid;place-items:center}
.ic svg{width:38px;height:38px;overflow:visible}
.seg button.on,.ic.on{background:#ffe3f0;color:var(--ink);outline:4px solid var(--hot);outline-offset:1px;z-index:1}
.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:14px 0 0 14px;border-right-width:0}.seg button:last-child{border-radius:0 14px 14px 0}
.step{display:flex;align-items:center;gap:6px;background:#fff8d6;border:3px solid var(--ink);border-radius:16px;padding:3px}
.step button{width:50px;height:50px;box-shadow:none;border-width:2px}
.step button svg{width:30px;height:30px}
.num{position:relative;width:56px;height:56px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.num canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.num b{position:absolute;right:-6px;bottom:-6px;background:var(--hot);color:#fff;border:2px solid var(--ink);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:15px;line-height:1}
.sp{flex:1}
#paperDot{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);vertical-align:-3px;margin-right:6px;background:var(--paper)}
#stage{position:relative;border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--paper);box-shadow:0 5px 0 var(--ink)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#brushes{display:flex;gap:6px;flex-wrap:wrap}
.br{padding:0;width:72px;height:58px;display:grid;place-items:center;overflow:hidden;background:var(--paper)}
.br canvas{width:64px;height:48px}
.br.on{outline:5px solid var(--hot);outline-offset:1px;background:var(--paper);color:var(--ink);transform:translateY(-3px)}
#colors{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:48px;height:48px;min-width:48px;padding:0;border-radius:50%}
.sw.on{outline:4px solid var(--hot);outline-offset:2px}
.custom{position:relative;overflow:hidden;background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
.custom input{position:absolute;inset:-8px;opacity:0;width:70px;height:70px;cursor:pointer}
.size{display:flex;align-items:center;gap:8px;background:#fff8d6;border:3px solid var(--ink);border-radius:16px;padding:4px 12px;min-height:50px}
.size .dot{display:block;flex:none;border-radius:50%;background:var(--cur,#2b1d0e);border:2px solid var(--ink)}
.size input{width:150px;height:44px;-webkit-appearance:none;appearance:none;background:transparent;touch-action:none}
.size input::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:var(--ink)}
.size input::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-13px;border-radius:50%;background:var(--cur,#fff);border:4px solid var(--ink)}
.size input::-moz-range-track{height:10px;border-radius:6px;background:var(--ink)}
.size input::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--cur,#fff);border:4px solid var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:17px;max-width:min(92vw,560px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
#toast.show{opacity:1}
#saveBox{position:fixed;inset:0;background:rgba(43,29,14,.75);display:none;place-items:center;z-index:9;padding:20px}
#saveBox.show{display:grid}
.card{background:var(--frame);border:4px solid var(--ink);border-radius:24px;padding:18px;max-width:720px;width:100%;display:grid;gap:12px;justify-items:center;text-align:center}
.card img{max-width:100%;max-height:60dvh;border:3px solid var(--ink);border-radius:12px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;background:#fff}
.card p{margin:0;font-size:18px}
.card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media(max-width:820px){.brand{display:none}}
@media(max-width:700px){.size input{width:100px}.br{width:60px}.br canvas{width:54px}.ic{width:50px;height:50px}.ic svg{width:32px;height:32px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head><body>
<div id="app">
  <header>
    <div class="brand">Mirror <span>Magic</span></div>
    <div class="seg" role="group" aria-label="Symmetry type">
      <button id="mMirror" class="ic on" aria-label="Mirror like a butterfly"><svg viewBox="0 0 32 32"><g id="wing"><path d="M16 16C11 3 2 5 3.5 12 4.5 16 10 16.5 16 16Z" fill="#ff3d8b"/><path d="M16 16C10 16.5 5.5 20 7.5 25.5 9.5 29 14 23 16 16Z" fill="#8338ec"/><circle cx="8" cy="10.5" r="2" fill="#ffd60a"/></g><use href="#wing" transform="translate(32 0) scale(-1 1)"/><path d="M16 2v28" stroke="#2b1d0e" stroke-width="2" stroke-dasharray="3 2.5"/></svg></button>
      <button id="mSpin" class="ic" aria-label="Spin like a pinwheel"><svg viewBox="0 0 32 32"><path d="M16 16V3l9 6Z" fill="#ff3d8b"/><path d="M16 16h13l-6 9Z" fill="#ffd60a"/><path d="M16 16v13l-9-6Z" fill="#00b4d8"/><path d="M16 16H3l6-9Z" fill="#70e000"/><circle cx="16" cy="16" r="2.6" fill="#2b1d0e"/></svg></button>
    </div>
    <div class="step">
      <button id="minus" class="ic" aria-label="Fewer lines"><svg viewBox="0 0 32 32"><path d="M7 16h18" stroke="#2b1d0e" stroke-width="5" stroke-linecap="round"/></svg></button>
      <div class="num"><canvas id="nprev"></canvas><b id="nval">6</b></div>
      <button id="plus" class="ic" aria-label="More lines"><svg viewBox="0 0 32 32"><path d="M7 16h18M16 7v18" stroke="#2b1d0e" stroke-width="5" stroke-linecap="round"/></svg></button>
    </div>
    <button id="bGuides" class="ic" aria-label="Show or hide the lines"><svg viewBox="0 0 32 32"><path d="M3 16C8 8 24 8 29 16 24 24 8 24 3 16Z" fill="#fff" stroke="#2b1d0e" stroke-width="2.5"/><circle cx="16" cy="16" r="5" fill="#3a86ff"/><circle cx="16" cy="16" r="2" fill="#2b1d0e"/><path id="eyeOff" d="M5 27 27 5" stroke="#e63946" stroke-width="3.5" stroke-linecap="round"/></svg></button>
    <button id="bCenter" class="ic" aria-label="Put the middle back"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#e63946"/><circle cx="16" cy="16" r="9" fill="#fff"/><circle cx="16" cy="16" r="5" fill="#e63946"/><circle cx="16" cy="16" r="2" fill="#fff"/></svg></button>
    <button id="bPaper" class="ic" aria-label="Change paper color"><svg viewBox="0 0 32 32"><path id="paperSheet" d="M7 3h13l6 6v20H7Z" fill="#fff" stroke="#2b1d0e" stroke-width="2.5" stroke-linejoin="round"/><path d="M20 3v6h6" fill="#ffd60a" stroke="#2b1d0e" stroke-width="2.5" stroke-linejoin="round"/></svg></button>
    <span class="sp"></span>
    <button id="bUndo" class="ic" aria-label="Undo"><svg viewBox="0 0 32 32"><path d="M11 6 4 13l7 7" fill="none" stroke="#3a86ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 13h13a8 8 0 0 1 0 16h-5" fill="none" stroke="#3a86ff" stroke-width="4" stroke-linecap="round"/></svg></button>
    <button id="bRedo" class="ic" aria-label="Redo"><svg viewBox="0 0 32 32" style="transform:scaleX(-1)"><path d="M11 6 4 13l7 7" fill="none" stroke="#70b000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 13h13a8 8 0 0 1 0 16h-5" fill="none" stroke="#70b000" stroke-width="4" stroke-linecap="round"/></svg></button>
    <button id="bClear" class="ic" aria-label="Throw away the drawing"><svg viewBox="0 0 32 32"><path d="M12 6V4h8v2" fill="none" stroke="#2b1d0e" stroke-width="2.5"/><path d="M5 7h22" stroke="#2b1d0e" stroke-width="3" stroke-linecap="round"/><path d="M8 10h16l-1.5 18h-13Z" fill="#9aa0a6" stroke="#2b1d0e" stroke-width="2.5" stroke-linejoin="round"/><path d="M13 14v10M19 14v10" stroke="#2b1d0e" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button id="bSave" class="ic" aria-label="Save picture"><svg viewBox="0 0 32 32"><path d="M11 9l2-4h6l2 4" fill="#2b1d0e"/><rect x="3" y="9" width="26" height="18" rx="4" fill="#8338ec" stroke="#2b1d0e" stroke-width="2.5"/><circle cx="16" cy="18" r="6" fill="#fff" stroke="#2b1d0e" stroke-width="2.5"/><circle cx="16" cy="18" r="2.6" fill="#00b4d8"/><circle cx="24.5" cy="13" r="1.6" fill="#ffd60a"/></svg></button>
  </header>
  <div id="stage"><canvas id="art"></canvas><canvas id="guide"></canvas></div>
  <footer>
    <div id="brushes"></div>
    <div id="colors"></div>
    <label class="size"><i class="dot" style="width:8px;height:8px"></i><input id="size" type="range" min="3" max="60" aria-label="Brush size"><i class="dot" style="width:30px;height:30px"></i></label>
  </footer>
</div>
<div id="toast"></div>
<div id="saveBox" role="dialog" aria-label="Save picture">
  <div class="card">
    <img id="saveImg" alt="Your drawing">
    <p>Press and hold the picture, then tap <b>Save to Photos</b>.</p>
    <div class="row"><button id="bCopy">Copy picture</button><button id="bClose" class="on" aria-label="Back to drawing"><svg viewBox="0 0 32 32" width="28" height="28" style="vertical-align:-7px;margin-right:6px"><path d="M7 25 25 7" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M22 4l6 6L13 25l-7 1 1-7Z" fill="#ffd60a" stroke="#fff" stroke-width="2"/></svg>Keep drawing</button></div>
  </div>
</div>
<script>
{
const $=id=>document.getElementById(id);
const stage=$('stage'),art=$('art'),g=$('guide'),ctx=art.getContext('2d'),gx=g.getContext('2d');
const PAPERS=['#ffffff','#14161c','#fff4d6','#dff1ff'];
const COLORS=['#e63946','#ff7b00','#ffd60a','#70e000','#00b4d8','#3a86ff','#8338ec','#ff4fa3','#8d5524','#ffffff','#9aa0a6','#111111'];
const BRUSHES=[['pen','Pen'],['rainbow','Rainbow'],['chisel','Fancy'],['crayon','Crayon'],['spray','Spray'],['neon','Glow'],['stars','Stars'],['eraser','Eraser']];
let S={mode:'mirror',n:6,cx:.5,cy:.5,ang:-Math.PI/2,guides:true,brush:'pen',color:'#3a86ff',size:12,paper:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('mm-s')||'{}'))}catch(e){}
let W=0,H=0,dpr=1;
const undo=[],redo=[],MAXU=8;
const strokes=new Map();let drag=null,saveT=0;

const toast=(t,ms=2600)=>{const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),ms)};
const store=()=>{try{localStorage.setItem('mm-s',JSON.stringify(S))}catch(e){}};
const storeArt=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('mm-art',art.toDataURL('image/png'))}catch(e){}},900)};

/* ---------- brushes: each returns a draw(c) so every mirror copy is identical ---------- */
function line(c,a,b,w,col){c.lineCap='round';c.lineJoin='round';c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x+(a.x===b.x&&a.y===b.y?.01:0),b.y);c.stroke()}
function star(c,x,y,r,rot,col){c.fillStyle=col;c.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,an=rot+i*Math.PI/5;c.lineTo(x+Math.cos(an)*rr,y+Math.sin(an)*rr)}c.closePath();c.fill()}
function seg(kind,st,a,b,w,col,blur){
  const d=Math.hypot(b.x-a.x,b.y-a.y);
  switch(kind){
    case 'pen':return c=>line(c,a,b,w,col);
    case 'rainbow':{const h=st.hue;st.hue=(st.hue+Math.max(d,2)*.6)%360;return c=>line(c,a,b,w,`hsl(${h},95%,55%)`)}
    case 'chisel':{const k=w*.75*Math.SQRT1_2;return c=>{c.fillStyle=col;c.strokeStyle=col;c.lineWidth=1.5;c.beginPath();c.moveTo(a.x+k,a.y-k);c.lineTo(b.x+k,b.y-k);c.lineTo(b.x-k,b.y+k);c.lineTo(a.x-k,a.y+k);c.closePath();c.fill();c.stroke()}}
    case 'crayon':{const n=Math.max(14,Math.ceil(d*w/4)),p=[];for(let i=0;i<n;i++){const t=Math.random(),r=w/2*Math.sqrt(Math.random()),an=Math.random()*6.283;p.push(a.x+(b.x-a.x)*t+Math.cos(an)*r,a.y+(b.y-a.y)*t+Math.sin(an)*r,.8+Math.random()*1.8)}
      return c=>{c.fillStyle=col;c.globalAlpha=.6;for(let i=0;i<p.length;i+=3)c.fillRect(p[i],p[i+1],p[i+2],p[i+2]);c.globalAlpha=1}}
    case 'spray':{const n=Math.ceil(w*1.4),p=[];for(let i=0;i<n;i++){const r=w*1.5*Math.sqrt(Math.random()),an=Math.random()*6.283;p.push(b.x+Math.cos(an)*r,b.y+Math.sin(an)*r)}
      return c=>{c.fillStyle=col;for(let i=0;i<p.length;i+=2)c.fillRect(p[i]-.7,p[i+1]-.7,1.4,1.4)}}
    case 'neon':return c=>{c.save();c.shadowColor=col;c.shadowBlur=w*1.3*blur;line(c,a,b,w*.7,col);c.shadowBlur=0;line(c,a,b,w*.25,'rgba(255,255,255,.9)');c.restore()};
    case 'stars':{const gap=w*2.4,p=[];let t=st.left;if(st.first){p.push(a.x,a.y,Math.random()*6.3);st.first=false;t=gap}
      while(t<=d){p.push(a.x+(b.x-a.x)*t/d,a.y+(b.y-a.y)*t/d,Math.random()*6.3);t+=gap}st.left=t-d;
      return c=>{for(let i=0;i<p.length;i+=3)star(c,p[i],p[i+1],w*.9,p[i+2],col)}}
    case 'eraser':return c=>{c.save();c.globalCompositeOperation='destination-out';line(c,a,b,w*2,'#000');c.restore()};
  }
}

/* ---------- symmetry ---------- */
function mats(){
  const out=[],cx=S.cx*W,cy=S.cy*H,deg=180/Math.PI;
  for(let k=0;k<S.n;k++){
    const t=360*k/S.n;
    out.push(new DOMMatrix().translate(cx,cy).rotate(t).translate(-cx,-cy));
    if(S.mode==='mirror')out.push(new DOMMatrix().translate(cx,cy).rotate(t).rotate(S.ang*deg).scale(1,-1).rotate(-S.ang*deg).translate(-cx,-cy));
  }
  return out;
}
function paint(fn,M){const base=new DOMMatrix([dpr,0,0,dpr,0,0]);for(const m of M){ctx.setTransform(base.multiply(m));fn(ctx)}ctx.setTransform(1,0,0,1,0,0)}

/* ---------- guides ---------- */
const knob=()=>({x:S.cx*W,y:S.cy*H});
const rotKnob=()=>{const c=knob(),R=Math.min(90,Math.min(W,H)*.22);return{x:c.x+Math.cos(S.ang)*R,y:c.y+Math.sin(S.ang)*R}};
function drawGuides(){
  gx.setTransform(dpr,0,0,dpr,0,0);gx.clearRect(0,0,W,H);
  if(!S.guides)return;
  const c=knob(),dark=S.paper===1,L=Math.hypot(W,H)*2;
  gx.strokeStyle=dark?'rgba(255,255,255,.35)':'rgba(43,29,14,.28)';gx.lineWidth=2;gx.setLineDash([10,8]);
  gx.beginPath();
  if(S.mode==='mirror'){for(let k=0;k<S.n;k++){const a=S.ang+Math.PI*k/S.n;gx.moveTo(c.x-Math.cos(a)*L,c.y-Math.sin(a)*L);gx.lineTo(c.x+Math.cos(a)*L,c.y+Math.sin(a)*L)}}
  else if(S.n>1){for(let k=0;k<S.n;k++){const a=S.ang+2*Math.PI*k/S.n;gx.moveTo(c.x,c.y);gx.lineTo(c.x+Math.cos(a)*L,c.y+Math.sin(a)*L)}}
  gx.stroke();gx.setLineDash([]);
  const r=rotKnob();
  gx.strokeStyle='#2b1d0e';gx.lineWidth=3;gx.beginPath();gx.moveTo(c.x,c.y);gx.lineTo(r.x,r.y);gx.stroke();
  gx.fillStyle='#fff';gx.beginPath();gx.arc(r.x,r.y,12,0,7);gx.fill();gx.stroke();
  gx.fillStyle='#ff3d8b';gx.beginPath();gx.arc(c.x,c.y,16,0,7);gx.fill();gx.stroke();
  gx.fillStyle='#fff';gx.beginPath();gx.arc(c.x,c.y,5,0,7);gx.fill();
}

/* ---------- canvas sizing ---------- */
function resize(){
  const r=stage.getBoundingClientRect(),nd=Math.min(window.devicePixelRatio||1,2),nw=Math.round(r.width),nh=Math.round(r.height);
  if(!nw||!nh||(nw===W&&nh===H&&nd===dpr))return;
  let old=null;if(W&&H){old=document.createElement('canvas');old.width=art.width;old.height=art.height;old.getContext('2d').drawImage(art,0,0)}
  W=nw;H=nh;dpr=nd;for(const c of[art,g]){c.width=W*dpr;c.height=H*dpr}
  if(old)ctx.drawImage(old,(art.width-old.width)/2,(art.height-old.height)/2);
  drawGuides();
}
const ro=new ResizeObserver(resize);ro.observe(stage);

/* ---------- undo ---------- */
function snap(){const c=document.createElement('canvas');c.width=art.width;c.height=art.height;c.getContext('2d').drawImage(art,0,0);return c}
function pushUndo(){undo.push(snap());if(undo.length>MAXU)undo.shift();redo.length=0;btns()}
function restore(c){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,art.width,art.height);ctx.drawImage(c,0,0);storeArt()}
function btns(){$('bUndo').disabled=!undo.length;$('bRedo').disabled=!redo.length}

/* ---------- pointer input ---------- */
const pos=e=>{const r=g.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
const width=e=>e.pointerType==='pen'&&e.pressure>0?S.size*(.35+e.pressure*1.3):S.size;
g.addEventListener('pointerdown',e=>{
  e.preventDefault();const p=pos(e);g.setPointerCapture(e.pointerId);
  if(S.guides&&!strokes.size){
    const c=knob(),r=rotKnob();
    if(Math.hypot(p.x-r.x,p.y-r.y)<28){drag={id:e.pointerId,k:'rot'};return}
    if(Math.hypot(p.x-c.x,p.y-c.y)<30){drag={id:e.pointerId,k:'center'};return}
  }
  if(drag)return;
  if(!strokes.size)pushUndo();
  const st={last:p,hue:Math.random()*360,left:0,first:true,M:mats()};strokes.set(e.pointerId,st);
  paint(seg(S.brush,st,p,p,width(e),S.color,dpr),st.M);
});
g.addEventListener('pointermove',e=>{
  if(drag&&drag.id===e.pointerId){
    const p=pos(e);
    if(drag.k==='center'){let x=Math.min(.97,Math.max(.03,p.x/W)),y=Math.min(.97,Math.max(.03,p.y/H));if(Math.abs(x*W-W/2)<12&&Math.abs(y*H-H/2)<12){x=.5;y=.5}S.cx=x;S.cy=y}
    else{const c=knob();let a=Math.atan2(p.y-c.y,p.x-c.x);const s=Math.PI/12,q=Math.round(a/s)*s;if(Math.abs(a-q)<.07)a=q;S.ang=a}
    drawGuides();return;
  }
  const st=strokes.get(e.pointerId);if(!st)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of(evs.length?evs:[e])){const p=pos(ev);if(Math.hypot(p.x-st.last.x,p.y-st.last.y)<1)continue;paint(seg(S.brush,st,st.last,p,width(ev),S.color,dpr),st.M);st.last=p}
});
const end=e=>{if(drag&&drag.id===e.pointerId){drag=null;store();return}if(strokes.delete(e.pointerId)&&!strokes.size)storeArt()};
g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.target===g)e.preventDefault()},{passive:false});

/* ---------- toolbar ---------- */
function brushPreviews(){
  for(const b of document.querySelectorAll('.br')){
    const cv=b.querySelector('canvas'),r=2,c=cv.getContext('2d');cv.width=64*r;cv.height=48*r;c.setTransform(r,0,0,r,0,0);
    const kind=b.dataset.k,st={hue:0,left:0,first:true},pts=[];for(let i=0;i<=24;i++)pts.push({x:7+i*2.1,y:24+Math.sin(i/24*Math.PI*2)*12});
    if(kind==='eraser'){ /* a pink rubber eraser */
      c.save();c.translate(32,24);c.rotate(-.5);c.lineWidth=2.5;c.strokeStyle='#2b1d0e';c.lineJoin='round';
      c.fillStyle='#ff8fb8';c.beginPath();c.roundRect(-20,-10,24,20,4);c.fill();c.stroke();
      c.fillStyle='#3a86ff';c.beginPath();c.roundRect(4,-10,16,20,4);c.fill();c.stroke();c.restore();continue}
    if(kind==='spray'){for(let i=0;i<pts.length;i+=2)seg('spray',st,pts[i],pts[i],6,S.color,r)(c)}
    else for(let i=1;i<pts.length;i++)seg(kind,st,pts[i-1],pts[i],kind==='stars'?7:kind==='neon'?10:kind==='crayon'?8:7,S.color,r)(c);
  }
}
function ui(){
  $('mMirror').classList.toggle('on',S.mode==='mirror');$('mSpin').classList.toggle('on',S.mode==='spin');
  $('nval').textContent=S.n;countPreview();
  $('eyeOff').style.display=S.guides?'none':'';
  $('paperSheet').setAttribute('fill',PAPERS[S.paper]);
  document.documentElement.style.setProperty('--paper',PAPERS[S.paper]);
  document.documentElement.style.setProperty('--cur',S.brush==='eraser'?'#fff':S.color);
  for(const b of document.querySelectorAll('.br'))b.classList.toggle('on',b.dataset.k===S.brush);
  let match=false;for(const b of document.querySelectorAll('.sw[data-c]')){const on=b.dataset.c===S.color;b.classList.toggle('on',on);match=match||on}
  $('custom').classList.toggle('on',!match);
  $('size').value=S.size;
  brushPreviews();drawGuides();store();
}
/* little round picture of the mirror lines, so the count is visible, not just a number */
function countPreview(){
  const cv=$('nprev'),r=2,c=cv.getContext('2d'),s=52;cv.width=cv.height=s*r;c.setTransform(r,0,0,r,0,0);
  const m=s/2,L=s/2-3,n=S.n;c.lineCap='round';c.lineWidth=2.5;
  if(S.mode==='mirror'){c.strokeStyle='#ff3d8b';c.beginPath();for(let k=0;k<n;k++){const a=-Math.PI/2+Math.PI*k/n;c.moveTo(m-Math.cos(a)*L,m-Math.sin(a)*L);c.lineTo(m+Math.cos(a)*L,m+Math.sin(a)*L)}c.stroke()}
  else{const cols=['#ff3d8b','#ffd60a','#00b4d8','#70e000','#8338ec','#ff7b00'];for(let k=0;k<n;k++){const a=-Math.PI/2+2*Math.PI*k/n,b=a+Math.min(.9,Math.PI/n);c.fillStyle=cols[k%cols.length];c.beginPath();c.moveTo(m,m);c.arc(m,m,L,a,b);c.closePath();c.fill()}}
  c.fillStyle='#2b1d0e';c.beginPath();c.arc(m,m,3,0,7);c.fill();
}
$('brushes').innerHTML=BRUSHES.map(([k,n])=>`<button class="br" data-k="${k}" aria-label="${n}"><canvas></canvas></button>`).join('');
$('colors').innerHTML=COLORS.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')+`<button class="sw custom" id="custom" aria-label="Pick any color"><input type="color" id="picker"></button>`;
$('brushes').addEventListener('click',e=>{const b=e.target.closest('.br');if(b){S.brush=b.dataset.k;ui()}});
$('colors').addEventListener('click',e=>{const b=e.target.closest('.sw[data-c]');if(b){S.color=b.dataset.c;if(S.brush==='eraser')S.brush='pen';ui()}});
$('picker').addEventListener('input',e=>{S.color=e.target.value;if(S.brush==='eraser')S.brush='pen';ui()});
$('size').addEventListener('input',e=>{S.size=+e.target.value;ui()});
$('mMirror').onclick=()=>{S.mode='mirror';ui()};
$('mSpin').onclick=()=>{S.mode='spin';ui()};
$('minus').onclick=()=>{S.n=Math.max(1,S.n-1);ui()};
$('plus').onclick=()=>{S.n=Math.min(16,S.n+1);ui()};
$('bGuides').onclick=()=>{S.guides=!S.guides;ui()};
$('bCenter').onclick=()=>{S.cx=.5;S.cy=.5;S.ang=-Math.PI/2;S.guides=true;ui()};
$('bPaper').onclick=()=>{S.paper=(S.paper+1)%PAPERS.length;ui()};
$('bUndo').onclick=()=>{if(!undo.length)return;redo.push(snap());restore(undo.pop());btns()};
$('bRedo').onclick=()=>{if(!redo.length)return;undo.push(snap());restore(redo.pop());btns()};
$('bClear').onclick=()=>{pushUndo();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,art.width,art.height);storeArt();toast('All clear! Tap Undo to bring it back.')};
function composite(){const c=document.createElement('canvas');c.width=art.width;c.height=art.height;const x=c.getContext('2d');x.fillStyle=PAPERS[S.paper];x.fillRect(0,0,c.width,c.height);x.drawImage(art,0,0);return c}
$('bSave').onclick=()=>{$('saveImg').src=composite().toDataURL('image/png');$('saveBox').classList.add('show')};
$('bClose').onclick=()=>$('saveBox').classList.remove('show');
$('bCopy').onclick=()=>{composite().toBlob(async b=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Copied! Paste it into Messages or Notes.')}catch(e){toast('Copy didn’t work here — press and hold the picture instead.')}})};

/* ---------- start ---------- */
resize();btns();ui();
try{const d=localStorage.getItem('mm-art');if(d){const im=new Image();im.onload=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(im,0,0,art.width,art.height)};im.src=d}}catch(e){}
try{if('serviceWorker' in navigator&&/(^|\.)gtalhub\.com$|^localhost$|^127\.0\.0\.1$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
toast('Drag the pink dot to move the middle. Turn the white dot to spin the lines.',4500);
}
</script>
</body></html>
