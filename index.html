<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTALHub</title>
<meta name="description" content="GTALHub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--line:#1e1e2e;--text:#f5f5f5;--muted:#8888aa;--green:#00ff88;
--display:"Bebas Neue",-apple-system,BlinkMacSystemFont,sans-serif;--mono:"Roboto Mono",ui-monospace,"SF Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 var(--mono);-webkit-font-smoothing:antialiased;
display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;pointer-events:none;
background:radial-gradient(70% 60% at 50% 50%,rgba(0,255,136,.07) 0%,transparent 70%),
linear-gradient(rgba(0,255,136,.035) 1px,transparent 1px) 0 0/48px 48px,
linear-gradient(90deg,rgba(0,255,136,.035) 1px,transparent 1px) 0 0/48px 48px}
main{position:relative;max-width:520px;padding:0 24px;text-align:center}
h1{font-family:var(--display);font-weight:400;letter-spacing:.04em;line-height:1;font-size:clamp(56px,11vw,96px);margin:0 0 22px}
p{color:var(--muted);margin:0}
.rule{width:64px;height:2px;margin:0 auto 22px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
</style>
</head>
<body>
<main>
<h1>GTALHub</h1>
<div class="rule"></div>
<p>There's nothing to browse here. If someone sent you one of our tools, open it with the full link they gave you.</p>
</main>
</body>
</html>
