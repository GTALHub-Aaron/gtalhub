name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity.
# This makes one tiny database request every three days so the Weigh-Off stays online.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl -fsS -X POST "https://hjwuluhdiczmssldyeus.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_zAZpo7UDyx1eHD_HpayR-g_RRjdgtO9" \
            -H "Content-Type: application/json" \
            -d '{}'
